<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 SYSTEMS - DEEP JUNGLE WAR (DEBUGGED)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020b05;
            color: #00ff66;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #sidebar {
            width: 220px;
            background: rgba(4, 18, 10, 0.95);
            border-right: 1px solid #00ff6633;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: bold;
            padding: 12px 8px;
            border-bottom: 1px solid #00ff6633;
            color: #00ff66;
            text-align: center;
        }
        #leaderboard {
            list-style: none;
            padding: 5px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: rgba(0, 255, 102, 0.03);
            border-left: 3px solid transparent;
            font-size: 11px;
            cursor: pointer;
        }
        .faction-row:hover {
            background: rgba(0, 255, 102, 0.15);
        }
        #main-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #top-bar {
            height: 35px;
            background: rgba(4, 18, 10, 0.9);
            border-bottom: 1px solid #00ff6633;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            z-index: 5;
        }
        .active-event {
            color: #ff3344;
            font-weight: bold;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
            background-color: #051d0d;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 90px;
            background: rgba(4, 18, 10, 0.95);
            border-top: 1px solid #00ff6633;
            display: flex;
            padding: 8px;
            gap: 10px;
            font-size: 10px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00dd55;
        }
        #stats-panel {
            width: 240px;
            border-left: 1px dashed #00ff6633;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">10 SYSTEMS - LEADERBOARD</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div>10 SYSTEMS - DEEP JUNGLE WAR</div>
                <div id="event-display" class="active-event">Faktor: Crvene Opasnosti</div>
                <div id="timer-display" style="color: #00ff66; font-weight: bold;">00:00 / 06:00</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; margin-bottom: 3px; color:#fff;" id="stat-name">Izaberite sistem</div>
                    <div>HP: <span id="stat-hp">-</span></div>
                    <div>Taktika: <span id="stat-taktika">-</span></div>
                    <div>Meta: <span id="stat-target">-</span></div>
                    <div>Sunce Bonus: <span id="stat-sun">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initPositions();
        });

        // Frakcije sa adaptivnom logikom
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: 85000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Agresivno', target: null },
            { id: 1, name: 'ORION', color: '#3399ff', hp: 74000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 2, name: 'ZEPHYR', color: '#33ff66', hp: 63000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: 58000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: 51000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: 45000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: 36000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: 31000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: 25000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: 18000, maxHp: 100000, x: 0, y: 0, lastAttacker: null, sunBonus: 0, tactic: 'Miran', target: null }
        ];

        function initPositions() {
            const w = canvas.width;
            const h = canvas.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 3);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 3);
            });
        }
        initPositions();

        // 1. Spoljašnji Faktor: Crvene opasne tačkice koje napadaju
        class RedHazard {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = 1.8;
                this.target = null;
                this.findTarget();
            }
            findTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) {
                    this.target = alive[Math.floor(Math.random() * alive.length)];
                }
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.findTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    // Napad na frakciju
                    if (dist < 15) {
                        const dmg = Math.floor(Math.random() * 500 + 300);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        logMessage(`[OPASNOST] Crvena tačka je pogodila ${this.target.name} (-${dmg} HP)`);
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.findTarget();
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0000';
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const hazards = Array.from({ length: 6 }, () => new RedHazard());

        // 2. Sunce i Ciklus Dana/Noći
        let sunAngle = 0;
        let sunState = { x: 0, y: 0, isDay: true };

        function updateSun() {
            sunAngle += 0.003;
            const w = canvas.width;
            const h = canvas.height;
            sunState.x = w / 2 + Math.cos(sunAngle) * (w * 0.45);
            sunState.y = h / 2 + Math.sin(sunAngle) * (h * 0.45);
            sunState.isDay = sunState.y < h / 2 + 50;

            // Daje nasumično život frakcijama na suncu
            if (sunState.isDay && Math.random() < 0.05) {
                const alive = factions.filter(f => f.hp > 0);
                const lucky = alive[Math.floor(Math.random() * alive.length)];
                const heal = Math.floor(Math.random() * 600 + 200);
                lucky.hp = Math.min(lucky.maxHp, lucky.hp + heal);
                lucky.sunBonus += heal;
                logMessage(`[SUNCE] ${lucky.name} upija sunčevu energiju (+${heal} HP)`);
            }
        }

        // 3. Adaptivna Logika Napada
        let beams = [];
        function adaptativeBattleLogic() {
            if (Math.random() < 0.07) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;

                const attacker = alive[Math.floor(Math.random() * alive.length)];
                let defender = null;

                // Pravilo 1: Ako je napadnut, ima 60% šanse da uzvrati napadaču (Osveta)
                if (attacker.lastAttacker && attacker.lastAttacker.hp > 0 && Math.random() < 0.6) {
                    defender = attacker.lastAttacker;
                    attacker.tactic = 'Osveta';
                } 
                // Pravilo 2: Ako ima malo HP-a, brani se i napada najslabijeg
                else if (attacker.hp < 30000) {
                    defender = alive.reduce((min, f) => f.hp < min.hp ? f : min, alive[0]);
                    attacker.tactic = 'Defanzivno';
                } 
                // Pravilo 3: Najjači napada trenutno vodećeg
                else {
                    const sorted = [...alive].sort((a, b) => b.hp - a.hp);
                    defender = (sorted[0].id !== attacker.id) ? sorted[0] : sorted[1];
                    attacker.tactic = 'Napad na Vođu';
                }

                if (defender && defender.id !== attacker.id) {
                    attacker.target = defender.name;
                    defender.lastAttacker = attacker;

                    const dmg = Math.floor(Math.random() * 900 + 300);
                    defender.hp = Math.max(0, defender.hp - dmg);

                    beams.push({
                        sx: attacker.x, sy: attacker.y,
                        tx: defender.x, ty: defender.y,
                        color: attacker.color, alpha: 1
                    });

                    logMessage(`[BORBA] ${attacker.name} (${attacker.tactic}) $\rightarrow$ ${defender.name} (-${dmg} HP)`);
                }
            }
        }

        // 4. Crtanje Šumske Mape
        function drawJungle() {
            const w = canvas.width;
            const h = canvas.height;

            // Zelena podloga
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#041f0d');
            bgGrad.addColorStop(0.5, '#0a3818');
            bgGrad.addColorStop(1, '#021207');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Šumske strukture / tekstura
            ctx.fillStyle = 'rgba(0, 255, 102, 0.03)';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                ctx.arc((i * 97) % w, (i * 53) % h, 30 + (i % 20), 0, Math.PI * 2);
                ctx.fill();
            }

            // Sunce
            if (sunState.isDay) {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ffcc00';
                ctx.fillStyle = '#ffee88';
                ctx.beginPath();
                ctx.arc(sunState.x, sunState.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, w, h);
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 12) consoleLog.removeChild(consoleLog.lastChild);
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';

            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `
                    <span><b>${rank + 1}</b> ${f.name}</span>
                    <span style="color:${f.color}">${Math.floor(f.hp)} HP</span>
                `;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${selectedFaction.hp} / ${selectedFaction.maxHp}`;
                document.getElementById('stat-taktika').innerText = selectedFaction.tactic;
                document.getElementById('stat-target').innerText = selectedFaction.target || 'Nema';
                document.getElementById('stat-sun').innerText = `+${selectedFaction.sunBonus} HP`;
            }
        }

        // Glavna Animaciona Petlja
        function loop() {
            drawJungle();
            updateSun();
            adaptativeBattleLogic();

            // Crvene opasnosti
            hazards.forEach(h => {
                h.update();
                h.draw();
            });

            // Linije napada
            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath();
                ctx.moveTo(b.sx, b.sy);
                ctx.lineTo(b.tx, b.ty);
                ctx.stroke();
                ctx.restore();
                b.alpha -= 0.04;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            // Frakcije
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = f.color;

                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 12, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, f.x, f.y - 16);
                ctx.restore();
            });

            updateUI();
            requestAnimationFrame(loop);
        }

        // 5. Debagovan Tajmer (Tačno 6 minuta)
        let totalSeconds = 0;
        const maxSeconds = 360; // 6 minuta * 60s

        const timerInterval = setInterval(() => {
            totalSeconds++;
            const currentM = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const currentS = String(totalSeconds % 60).padStart(2, '0');
            
            timerDisplay.innerText = `${currentM}:${currentS} / 06:00`;

            if (totalSeconds >= maxSeconds) {
                clearInterval(timerInterval);
                logMessage("[KRAJ] Simulacija od 6 minuta je završena!");
                alert("Simulacija je završena! Pobednik je frakcija sa najviše HP-a.");
            }
        }, 1000);

        loop();
    </script>
</body>
</html>
