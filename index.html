            <!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 SYSTEMS - TOTAL WAR SIMULATION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010804;
            color: #00ff66;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #sidebar {
            width: 230px;
            background: rgba(3, 14, 8, 0.95);
            border-right: 1px solid #00ff6633;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: bold;
            padding: 10px 8px;
            border-bottom: 1px solid #00ff6633;
            color: #00ff66;
            text-align: center;
            background: rgba(0, 255, 102, 0.05);
        }
        #leaderboard {
            list-style: none;
            padding: 4px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 3px;
            background: rgba(0, 255, 102, 0.02);
            border-left: 3px solid transparent;
            font-size: 10px;
            cursor: pointer;
        }
        .faction-row:hover {
            background: rgba(0, 255, 102, 0.12);
        }
        #main-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #top-bar {
            height: 35px;
            background: rgba(3, 14, 8, 0.9);
            border-bottom: 1px solid #00ff6633;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 95px;
            background: rgba(3, 14, 8, 0.95);
            border-top: 1px solid #00ff6633;
            display: flex;
            padding: 6px 10px;
            gap: 10px;
            font-size: 10px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00dd55;
        }
        #stats-panel {
            width: 250px;
            border-left: 1px dashed #00ff6633;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">10 SYSTEMS - WAR MAP</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div>10 SYSTEMS - DEEP JUNGLE SIMULATION</div>
                <div id="event-display" style="color: #00ccff; font-weight: bold;">Faktor: Tropska Oluja</div>
                <div id="timer-display" style="color: #00ff66; font-weight: bold;">00:00 / 06:00</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; margin-bottom: 2px; color:#fff;" id="stat-name">Izaberite bazu</div>
                    <div>HP: <span id="stat-hp">-</span></div>
                    <div>Teritorija: <span id="stat-territory">-</span></div>
                    <div>Taktika: <span id="stat-taktika">-</span></div>
                    <div>Meta: <span id="stat-target">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initPositions();
        });

        // Frakcije i Hi-Tech Baze
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: 85240, maxHp: 100000, x: 0, y: 0, territory: 12, tactic: 'Agresivno', target: null },
            { id: 1, name: 'ORION', color: '#3399ff', hp: 74560, maxHp: 100000, x: 0, y: 0, territory: 10, tactic: 'Miran', target: null },
            { id: 2, name: 'ZEPHYR', color: '#33ff66', hp: 63180, maxHp: 100000, x: 0, y: 0, territory: 9, tactic: 'Miran', target: null },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: 58730, maxHp: 100000, x: 0, y: 0, territory: 8, tactic: 'Miran', target: null },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: 51260, maxHp: 100000, x: 0, y: 0, territory: 7, tactic: 'Miran', target: null },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: 45900, maxHp: 100000, x: 0, y: 0, territory: 6, tactic: 'Miran', target: null },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: 36800, maxHp: 100000, x: 0, y: 0, territory: 5, tactic: 'Miran', target: null },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: 31240, maxHp: 100000, x: 0, y: 0, territory: 5, tactic: 'Miran', target: null },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: 25680, maxHp: 100000, x: 0, y: 0, territory: 4, tactic: 'Miran', target: null },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: 18930, maxHp: 100000, x: 0, y: 0, territory: 3, tactic: 'Miran', target: null }
        ];

        function initPositions() {
            const w = canvas.width;
            const h = canvas.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 2.8);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 2.8);
            });
        }
        initPositions();

        // 1. Oluja i Kiša (Storm)
        let rainDrops = [];
        for (let i = 0; i < 120; i++) {
            rainDrops.push({
                x: Math.random() * 2000,
                y: Math.random() * 1000,
                l: Math.random() * 15 + 10,
                speed: Math.random() * 10 + 12
            });
        }

        // 2. Neutralna Čudovišta iz Džungle
        class JungleMonster {
            constructor() {
                this.reset();
            }
            reset() {
                // Nastaju u samom centru mape u džungli
                const w = canvas.width;
                const h = canvas.height;
                this.x = w / 2 + (Math.random() - 0.5) * 80;
                this.y = h / 2 + (Math.random() - 0.5) * 80;
                this.speed = Math.random() * 1.2 + 0.8;
                this.size = Math.random() * 4 + 3;
                this.findTarget();
            }
            findTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) {
                    this.target = alive[Math.floor(Math.random() * alive.length)];
                }
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.findTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 20) {
                        const dmg = Math.floor(Math.random() * 400 + 150);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        logMessage(`[ČUDOVIŠTE] Zver iz džungle napada ${this.target.name} (-${dmg} HP)`);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff2200';
                ctx.fillStyle = '#ff2200';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const monsters = Array.from({ length: 8 }, () => new JungleMonster());

        // 3. Crtanje Mapa Pozadine (Kao na slici 2)
        function drawRealisticTerrain() {
            const w = canvas.width;
            const h = canvas.height;

            // Osnovni pejzaž
            let grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w);
            grad.addColorStop(0, '#06200d'); // Gusta centralna džungla
            grad.addColorStop(0.6, '#0d2d16');
            grad.addColorStop(1, '#020b05');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Planinski masivi i Reke
            ctx.strokeStyle = '#00ff6615';
            ctx.lineWidth = 1;

            // Teritorije (Heksagonalni efekat ispod baza)
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.fillStyle = f.color + '12';
                ctx.strokeStyle = f.color + '44';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 45, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // Centralna Džungla Oznaka
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.2)';
            ctx.fillStyle = 'rgba(0, 40, 15, 0.4)';
            ctx.beginPath();
            ctx.arc(w/2, h/2, 90, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 102, 0.4)';
            ctx.font = '9px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText("OPASNA DŽUNGLA", w/2, h/2);
            ctx.restore();
        }

        // 4. Crtanje Hi-Tech Baze (Zgrade umesto krugova)
        function drawHiTechBase(f) {
            ctx.save();
            ctx.translate(f.x, f.y);

            // Baza građe (Izometrijska kocka / Zgrada)
            const size = 14;
            
            // Senka / Svetlo
            ctx.shadowBlur = 15;
            ctx.shadowColor = f.color;

            // Osnova objekta
            ctx.fillStyle = '#0a1a10';
            ctx.strokeStyle = f.color;
            ctx.lineWidth = 1.5;

            // Zgrada telo
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(size, -size / 2);
            ctx.lineTo(size, size / 2);
            ctx.lineTo(0, size);
            ctx.lineTo(-size, size / 2);
            ctx.lineTo(-size, -size / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Neonska Kula / Jezgro u sredini
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(0, -2, 4, 0, Math.PI * 2);
            ctx.fill();

            // Ime i HP Baze
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(f.name, 0, -size - 6);

            ctx.restore();
        }

        // 5. Crtanje Oluje i Kiše
        function drawStorm() {
            ctx.save();
            ctx.strokeStyle = 'rgba(150, 200, 255, 0.3)';
            ctx.lineWidth = 1;
            rainDrops.forEach(r => {
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x - 2, r.y + r.l);
                ctx.stroke();

                r.y += r.speed;
                r.x -= 0.5;
                if (r.y > canvas.height) {
                    r.y = -20;
                    r.x = Math.random() * canvas.width;
                }
            });
            ctx.restore();
        }

        // Adaptivni Napadi
        let beams = [];
        function runBattles() {
            if (Math.random() < 0.08) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;

                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    const dmg = Math.floor(Math.random() * 800 + 200);
                    tgt.hp = Math.max(0, tgt.hp - dmg);
                    src.target = tgt.name;

                    beams.push({
                        sx: src.x, sy: src.y,
                        tx: tgt.x, ty: tgt.y,
                        color: src.color, alpha: 1
                    });

                    logMessage(`[NAPAD] ${src.name} lansira projektil na ${tgt.name} (-${dmg} HP)`);
                }
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 10) consoleLog.removeChild(consoleLog.lastChild);
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';

            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `
                    <span><b>${rank + 1}</b> ${f.name}</span>
                    <span style="color:${f.color}">${Math.floor(f.hp)}</span>
                `;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${selectedFaction.hp} / ${selectedFaction.maxHp}`;
                document.getElementById('stat-territory').innerText = `${selectedFaction.territory} ZONA`;
                document.getElementById('stat-taktika').innerText = selectedFaction.tactic;
                document.getElementById('stat-target').innerText = selectedFaction.target || 'Nema';
            }
        }

        // Glavna Petlja Renderovanja
        function loop() {
            drawRealisticTerrain();
            runBattles();

            // Mreža Lasera
            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath();
                ctx.moveTo(b.sx, b.sy);
                ctx.lineTo(b.tx, b.ty);
                ctx.stroke();
                ctx.restore();
                b.alpha -= 0.04;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            // Čudovišta
            monsters.forEach(m => {
                m.update();
                m.draw();
            });

            // Baze
            factions.forEach(f => {
                if (f.hp > 0) drawHiTechBase(f);
            });

            // Kiša / Oluja preko svega
            drawStorm();

            updateUI();
            requestAnimationFrame(loop);
        }

        // Tajmer 6 minuta
        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s} / 06:00`;
        }, 1000);

        loop();
    </script>
</body>
</html>
