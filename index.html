<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 SYSTEMS - DEEP JUNGLE WAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010804;
            color: #00ff66;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #sidebar {
            width: 230px;
            background: rgba(3, 14, 8, 0.95);
            border-right: 1px solid #00ff6633;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: bold;
            padding: 10px 8px;
            border-bottom: 1px solid #00ff6633;
            color: #00ff66;
            text-align: center;
            background: rgba(0, 255, 102, 0.05);
        }
        #leaderboard {
            list-style: none;
            padding: 4px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            margin-bottom: 3px;
            background: rgba(0, 255, 102, 0.02);
            border-left: 3px solid transparent;
            font-size: 10px;
            cursor: pointer;
        }
        .faction-row:hover {
            background: rgba(0, 255, 102, 0.12);
        }
        #main-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #top-bar {
            height: 35px;
            background: rgba(3, 14, 8, 0.9);
            border-bottom: 1px solid #00ff6633;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 95px;
            background: rgba(3, 14, 8, 0.95);
            border-top: 1px solid #00ff6633;
            display: flex;
            padding: 6px 10px;
            gap: 10px;
            font-size: 10px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00dd55;
        }
        #stats-panel {
            width: 250px;
            border-left: 1px dashed #00ff6633;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">10 SYSTEMS - LEADERBOARD</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div>10 SYSTEMS - DEEP JUNGLE WAR</div>
                <div id="event-display" style="color: #ffaa00; font-weight: bold;">Solar Sun Heal Active</div>
                <div id="timer-display" style="color: #00ff66; font-weight: bold;">00:00 / 06:00</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; margin-bottom: 2px; color:#fff;" id="stat-name">Izaberite bazu</div>
                    <div>HP: <span id="stat-hp">-</span></div>
                    <div>Solarni Bonus: <span id="stat-sun">-</span></div>
                    <div>Status: <span id="stat-status">-</span></div>
                    <div>Meta: <span id="stat-target">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');

        // Učitavanje Deep Jungle Walk Pozadine
        const bgImage = new Image();
        bgImage.src = 'deep_jungle_walk.jpg'; // Ovdje se učitava jpg slika pozadine

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initPositions();
        });

        // Frakcije
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: 85000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 1, name: 'ORION', color: '#3399ff', hp: 74000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 2, name: 'ZEPHYR', color: '#33ff66', hp: 63000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: 58000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: 51000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: 45000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: 36000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: 31000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: 25000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: 18000, maxHp: 100000, x: 0, y: 0, sunHealTotal: 0, target: null }
        ];

        function initPositions() {
            const w = canvas.width;
            const h = canvas.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 2.7);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 2.7);
            });
        }
        initPositions();

        // Solar Sun Entitet (Veće od svih ostalih elemenata)
        const solarSun = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 80,
            healRadius: 160,
            angle: 0,
            speed: 0.005
        };

        function updateSolarSun() {
            const w = canvas.width;
            const h = canvas.height;
            solarSun.angle += solarSun.speed;
            solarSun.x = w / 2 + Math.cos(solarSun.angle) * (w * 0.3);
            solarSun.y = h / 2 + Math.sin(solarSun.angle * 0.7) * (h * 0.25);

            // Zračenje i regeneracija (Heal) baza pod suncem
            factions.forEach(f => {
                if (f.hp <= 0) return;
                const dist = Math.hypot(f.x - solarSun.x, f.y - solarSun.y);
                if (dist < solarSun.healRadius) {
                    const healAmount = 30;
                    if (f.hp < f.maxHp) {
                        f.hp = Math.min(f.maxHp, f.hp + healAmount);
                        f.sunHealTotal += healAmount;
                    }
                }
            });
        }

        function drawSolarSun() {
            ctx.save();
            
            // Spoljašnji lečeći prsten
            const aura = ctx.createRadialGradient(
                solarSun.x, solarSun.y, solarSun.radius * 0.5,
                solarSun.x, solarSun.y, solarSun.healRadius
            );
            aura.addColorStop(0, 'rgba(255, 200, 0, 0.4)');
            aura.addColorStop(0.5, 'rgba(255, 140, 0, 0.15)');
            aura.addColorStop(1, 'rgba(255, 100, 0, 0)');
            
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(solarSun.x, solarSun.y, solarSun.healRadius, 0, Math.PI * 2);
            ctx.fill();

            // Solar Sun Telo
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ffaa00';
            const sunGrad = ctx.createRadialGradient(
                solarSun.x, solarSun.y, 5,
                solarSun.x, solarSun.y, solarSun.radius
            );
            sunGrad.addColorStop(0, '#ffffff');
            sunGrad.addColorStop(0.3, '#ffea00');
            sunGrad.addColorStop(0.8, '#ff6600');
            sunGrad.addColorStop(1, 'rgba(200, 50, 0, 0.8)');

            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(solarSun.x, solarSun.y, solarSun.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Globalni Enemy sistemi (Lutajući napadači između frakcija)
        class WanderingEnemy {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = Math.random() * 2 + 1;
                this.targetFaction = null;
                this.pickRandomTarget();
            }
            pickRandomTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) {
                    this.targetFaction = alive[Math.floor(Math.random() * alive.length)];
                }
            }
            update() {
                if (!this.targetFaction || this.targetFaction.hp <= 0) {
                    this.pickRandomTarget();
                }
                if (this.targetFaction) {
                    const dx = this.targetFaction.x - this.x;
                    const dy = this.targetFaction.y - this.y;
                    const dist = Math.hypot(dx, dy);

                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 18) {
                        const dmg = Math.floor(Math.random() * 500 + 200);
                        this.targetFaction.hp = Math.max(0, this.targetFaction.hp - dmg);
                        logMessage(`[ENEMY ATTACK] Neutralni neprijatelj je pogodio ${this.targetFaction.name} (-${dmg} HP)`);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const globalEnemies = Array.from({ length: 10 }, () => new WanderingEnemy());

        // Crtanje Debagovane Pozadine
        function drawBackground() {
            const w = canvas.width;
            const h = canvas.height;

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, w, h);
            } else {
                // Fallback tekstura za Deep Jungle Walk
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#020f06');
                grad.addColorStop(0.5, '#082611');
                grad.addColorStop(1, '#010a04');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Džungla staza (Jungle Walk)
                ctx.strokeStyle = 'rgba(40, 70, 30, 0.4)';
                ctx.lineWidth = 40;
                ctx.beginPath();
                ctx.moveTo(w * 0.1, h);
                ctx.bezierCurveTo(w * 0.3, h * 0.6, w * 0.7, h * 0.4, w * 0.9, 0);
                ctx.stroke();
            }

            // Tamni filter za bolju vidljivost UI elemenata
            ctx.fillStyle = 'rgba(0, 10, 5, 0.35)';
            ctx.fillRect(0, 0, w, h);
        }

        // Crtanje Frakcija i Hi-Tech Baza
        function drawFactions() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                
                ctx.save();
                ctx.translate(f.x, f.y);

                // Hi-Tech Baza Zgrada
                ctx.shadowBlur = 15;
                ctx.shadowColor = f.color;
                ctx.fillStyle = '#0a1d12';
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(14, -7);
                ctx.lineTo(14, 7);
                ctx.lineTo(0, 14);
                ctx.lineTo(-14, 7);
                ctx.lineTo(-14, -7);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Svetleći centar
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();

                // Tekst
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -20);

                ctx.restore();
            });
        }

        // Borba između frakcija
        let beams = [];
        function runFactionBattles() {
            if (Math.random() < 0.08) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;

                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    const dmg = Math.floor(Math.random() * 700 + 200);
                    tgt.hp = Math.max(0, tgt.hp - dmg);
                    src.target = tgt.name;

                    beams.push({
                        sx: src.x, sy: src.y,
                        tx: tgt.x, ty: tgt.y,
                        color: src.color, alpha: 1
                    });

                    logMessage(`[WAR] ${src.name} $\rightarrow$ ${tgt.name} (-${dmg} HP)`);
                }
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 10) consoleLog.removeChild(consoleLog.lastChild);
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';

            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `
                    <span><b>${rank + 1}</b> ${f.name}</span>
                    <span style="color:${f.color}">${Math.floor(f.hp)}</span>
                `;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${selectedFaction.hp} / ${selectedFaction.maxHp}`;
                document.getElementById('stat-sun').innerText = `+${selectedFaction.sunHealTotal} HP`;
                document.getElementById('stat-status').innerText = selectedFaction.hp > 0 ? 'Aktivna' : 'Uništena';
                document.getElementById('stat-target').innerText = selectedFaction.target || 'Nema';
            }
        }

        // Glavna Render Petlja
        function loop() {
            drawBackground();
            updateSolarSun();
            drawSolarSun();
            runFactionBattles();

            // Renderovanje Lasera
            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath();
                ctx.moveTo(b.sx, b.sy);
                ctx.lineTo(b.tx, b.ty);
                ctx.stroke();
                ctx.restore();
                b.alpha -= 0.04;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            // Globalni neprijatelji
            globalEnemies.forEach(e => {
                e.update();
                e.draw();
            });

            drawFactions();
            updateUI();
            requestAnimationFrame(loop);
        }

        // Tajmer
        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s} / 06:00`;
        }, 1000);

        loop();
    </script>
</body>
</html>
