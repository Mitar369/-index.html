<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategijska Mapa - 60 FPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        button {
            background: rgba(15, 23, 42, 0.85);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        button.active {
            background: #3b82f6;
            border-color: #60a5fa;
            color: #ffffff;
        }
        #fps {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <button id="btn-theme0" class="active" onclick="setTheme(0)">🌲 Šumska (Klasika)</button>
        <button id="btn-theme1" onclick="setTheme(1)">🏜️ Pustinjska / Suva</button>
        <button id="btn-theme2" onclick="setTheme(2)">🌙 Noćna / Mistična</button>
    </div>

    <div id="fps">60 FPS</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Podešavanje visoke rezolucije ekrana (Retina / High-DPI support za telefon)
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Teme boja (3 različite mape sa tvoje slike/koncepta)
        const themes = [
            { // Tema 0: Šumska klasika (Zeleno / Plavo jezero)
                bg: '#1e382b',
                forest: '#14281e',
                forestLight: '#234433',
                lake: '#1d4ed8',
                lakeShallow: '#3b82f6',
                nodeBg: '#2d3748',
                nodeBorder: '#d69e2e',
                text: '#ffffff'
            },
            { // Tema 1: Pustinjska / Ratna zona (Zlatno / Braon / Tamno plava voda)
                bg: '#3d2e1e',
                forest: '#2d2114',
                forestLight: '#4a3822',
                lake: '#0284c7',
                lakeShallow: '#38bdf8',
                nodeBg: '#292524',
                nodeBorder: '#eab308',
                text: '#fef08a'
            },
            { // Tema 2: Noćna / Mistična (Tamno ljubičasta / Magična plava)
                bg: '#181124',
                forest: '#110c1a',
                forestLight: '#251b36',
                lake: '#7c3aed',
                lakeShallow: '#a78bfa',
                nodeBg: '#1f1d2b',
                nodeBorder: '#c084fc',
                text: '#f3e8ff'
            }
        ];

        let currentTheme = 0;

        function setTheme(index) {
            currentTheme = index;
            document.querySelectorAll('#ui-container button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        // Definicija cvorova sa mape (strategijske tačke kao sa slike)
        const nodes = [
            { x: 250, y: 180, label: "Dragon Peak", type: "castle", gold: 500 },
            { x: 420, y: 280, label: "Orange Grove", type: "village", gold: 300 },
            { x: 580, y: 280, label: "Deep Jungle", type: "village", gold: 300 },
            { x: 740, y: 280, label: "Vineyards Grove", type: "village", gold: 300 },
            { x: 880, y: 350, label: "Green Plain", type: "village", gold: 300 },
            { x: 120, y: 450, label: "Emerald Tangle", type: "village", gold: 300 },
            { x: 380, y: 480, label: "Swamp Jungle", type: "village", gold: 300 },
            { x: 500, y: 490, label: "Smoky Pond", type: "lake_node", gold: 400 },
            { x: 740, y: 470, label: "Whitehenge", type: "village", gold: 300 },
            { x: 860, y: 480, label: "Rocky Coast", type: "village", gold: 300 },
            { x: 220, y: 580, label: "Pink Grove", type: "village", gold: 300 },
            { x: 450, y: 600, label: "Bounty Grove", type: "village", gold: 300 },
            { x: 600, y: 590, label: "Spanish Mission", type: "village", gold: 300 },
            { x: 720, y: 580, label: "Pink Grove 2", type: "village", gold: 300 }
        ];

        // Povezivanje linija (puteva) između čvorova
        const connections = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [1, 6], [2, 7], [3, 7], [4, 8], [4, 9],
            [5, 6], [6, 7], [7, 8], [8, 9],
            [5, 10], [6, 11], [7, 12], [8, 13],
            [10, 11], [11, 12], [12, 13]
        ];

        // Kamera i pomeranje (Pan & Zoom za telefon)
        let camera = { x: -100, y: -50, scale: 0.9 };
        let isDragging = false;
        let startX, startY;

        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            camera.x += (e.clientX - startX);
            camera.y += (e.clientY - startY);
            startX = e.clientX;
            startY = e.clientY;
        });

        canvas.addEventListener('pointerup', () => isDragging = false);
        canvas.addEventListener('pointercancel', () => isDragging = false);

        // Petlja za renderovanje (60 FPS)
        function draw() {
            const t = themes[currentTheme];
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.scale, camera.scale);

            // 1. Crtanje jezera (Vodene površine kao sa slike)
            ctx.fillStyle = t.lake;
            ctx.beginPath();
            ctx.ellipse(200, 350, 180, 100, -0.2, 0, Math.PI * 2);
            ctx.ellipse(820, 600, 220, 120, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Plitki delovi jezera (efekti talasa)
            ctx.strokeStyle = t.lakeShallow;
            ctx.lineWidth = 3;
            ctx.stroke();

            // 2. Crtanje šuma (tekstura trouglova/drvća)
            ctx.fillStyle = t.forest;
            for (let i = 0; i < 40; i++) {
                let fx = (i * 137) % 1000 + 50;
                let fy = (i * 93) % 800 + 100;
                ctx.beginPath();
                ctx.moveTo(fx, fy - 15);
                ctx.lineTo(fx - 12, fy + 10);
                ctx.lineTo(fx + 12, fy + 10);
                ctx.closePath();
                ctx.fill();
            }

            // 3. Putevi (Linije između čvorova)
            ctx.strokeStyle = 'rgba(214, 158, 46, 0.4)';
            ctx.lineWidth = 4;
            connections.forEach(conn => {
                let p1 = nodes[conn[0]];
                let p2 = nodes[conn[1]];
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            });

            // 4. Crtanje čvorova (zgrada/sela sa zlatnikom)
            nodes.forEach(node => {
                // Pozadina čvora
                ctx.fillStyle = t.nodeBg;
                ctx.strokeStyle = t.nodeBorder;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(node.x, node.y, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Ikonica u čvoru (zastavica / krov)
                ctx.fillStyle = t.text;
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(node.type === 'castle' ? '🏰' : '🛖', node.x, node.y - 2);

                // Zlatnici / Resurs ispod čvora
                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(`💰 ${node.gold}`, node.x, node.y + 38);

                // Ime lokacije
                ctx.fillStyle = t.text;
                ctx.font = '11px sans-serif';
                ctx.fillText(node.label, node.x, node.y - 32);
            });

            ctx.restore();
            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
