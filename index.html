<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 SYSTEMS - 5D MULTIVERSE WAR SIMULATION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000205;
            color: #00ffcc;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 180px;
            background: rgba(1, 8, 15, 0.95);
            border-right: 1px solid #00ffcc33;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 10px;
            font-weight: bold;
            padding: 8px;
            border-bottom: 1px solid #00ffcc33;
            text-align: center;
            background: rgba(0, 255, 204, 0.05);
            letter-spacing: 1px;
        }
        #leaderboard {
            list-style: none;
            padding: 4px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            margin-bottom: 2px;
            background: rgba(0, 255, 204, 0.02);
            border-left: 3px solid transparent;
            font-size: 9px;
            cursor: pointer;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #top-bar {
            height: 35px;
            background: rgba(1, 8, 15, 0.95);
            border-bottom: 1px solid #00ffcc33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 10px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 80px;
            background: rgba(1, 8, 15, 0.95);
            border-top: 1px solid #00ffcc33;
            display: flex;
            padding: 4px;
            gap: 6px;
            font-size: 9px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00ffcc;
        }
        #stats-panel {
            width: 160px;
            border-left: 1px dashed #00ffcc33;
            padding-left: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">5D MULTIVERSE (500K)</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div id="boss-status" style="color:#ff0055; font-weight:bold;">BOSS: NEAKTIAN</div>
                <div id="factor-display" style="color: #00ffff; font-weight: bold;">FAKTOR: Inicijalizacija...</div>
                <div id="timer-display" style="color: #00ffcc;">06:30</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; color:#fff;" id="stat-name">Baza</div>
                    <div>HP: <span id="stat-hp">500000</span></div>
                    <div>Solarni Efekat: <span id="stat-sun">-</span></div>
                    <div>Status: <span id="stat-meta">Stabilno</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');
        const factorDisplay = document.getElementById('factor-display');
        const bossStatusDisplay = document.getElementById('boss-status');

        const droneImg = new Image();
        droneImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="16,0 32,16 16,32 0,16" fill="%2300ffcc" opacity="0.3"/><polygon points="16,4 28,16 16,28 4,16" fill="%23000510" stroke="%2300ffcc" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="%23ff0055"/></svg>';

        function fitCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }

        const attackFactors = [
            { name: '5D Vremenski Rascep', dmg: 2500, msg: 'Vremenski procep iz 5D dimenzije razara baze!' },
            { name: 'Meteorit Udari', dmg: 2000, msg: '5D Meteorski pljusak drobi strukture!' },
            { name: 'Kvantni Blesak', dmg: 1500, msg: 'Kvantni blesak spali energetsku mrežu!' },
            { name: 'Antimatrijski Talas', dmg: 2800, msg: 'Antimatrija dezintegriše komandne komponente!' },
            { name: 'Void Oluja', dmg: 3200, msg: 'Void portal usisava HP struktura!' },
            { name: 'Grafitna Kiša', dmg: 1800, msg: 'Grafitni talas izaziva masovne kratke spojeve!' },
            { name: 'Pulsar Udar', dmg: 2200, msg: 'Kosmički pulsar pretvara štitove u prah!' },
            { name: 'Plazma Nepogoda', dmg: 2700, msg: 'Plazma sprži eksterne senzore!' },
            { name: 'Tektonski Rascep', dmg: 1900, msg: '5D Tektonski šok lomi prostornu osnovu!' },
            { name: 'Seizmički Šok', dmg: 1400, msg: 'Seizmički udar destabilizuje baze!' }
        ];
        let currentFactor = attackFactors[0];

        // 10 Frakcija - TAČNO 500.000 HP
        const STARTING_HP = 500000;
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 1, name: 'ORION', color: '#00ccff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 2, name: 'ZEPHYR', color: '#00ff66', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0, meta: 'Stabilno' }
        ];

        function initPositions() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 3.2);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 3.2);
            });
        }

        window.addEventListener('resize', () => { fitCanvas(); initPositions(); });
        fitCanvas();
        initPositions();

        // 5D PROSTOR I DRUGA DIMENZIJA (Spoljašnji Prsten + Efekti)
        let warpAngle = 0;
        function draw5DMultiverseEnvironment() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            warpAngle += 0.008;

            // 5D Deep Void Gradient
            const bgGrad = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, Math.max(w, h));
            bgGrad.addColorStop(0, '#020b14');
            bgGrad.addColorStop(0.5, '#01050a');
            bgGrad.addColorStop(1, '#000103');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // DRUGA DIMENZIJA - Spoljašnji Prsten
            ctx.save();
            ctx.translate(w/2, h/2);
            const outerRadius = Math.min(w, h) * 0.44;
            
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 15]);
            ctx.beginPath();
            ctx.arc(0, 0, outerRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Sfere u Drugoj Dimenziji
            const outerNodes = 6;
            for(let i=0; i<outerNodes; i++) {
                const a = warpAngle + (i / outerNodes) * Math.PI * 2;
                const ox = Math.cos(a) * outerRadius;
                const oy = Math.sin(a) * outerRadius;

                ctx.fillStyle = '#ff00aa';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff00aa';
                ctx.beginPath();
                ctx.arc(ox, oy, 6, 0, Math.PI * 2);
                ctx.fill();

                // Snopovi iz Druge Dimenzije ka Centru
                if(Math.random() < 0.05) {
                    beams.push({ sx: w/2 + ox, sy: h/2 + oy, tx: w/2, ty: h/2, color: '#ff00aa', alpha: 0.8, width: 1 });
                }
            }
            ctx.restore();

            // 5D Hyper-Grid Distortion
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            for (let r = 40; r < Math.max(w, h); r += 45) {
                ctx.beginPath();
                ctx.arc(w/2, h/2, r + Math.sin(warpAngle + r) * 8, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        // VEĆI OSCILATORNI KRUG ZA SUNCE
        const solarSun = { x: 0, y: 0, radius: 75, pulse: 0, angle: 0 };
        function updateSolarSun() {
            const rect = canvas.parentElement.getBoundingClientRect();
            solarSun.pulse += 0.04;
            solarSun.angle += 0.012;

            // Znatno veći oscilatorni krug prečnika 0.42 dimenzije ekrana
            solarSun.x = rect.width / 2 + Math.cos(solarSun.angle) * (rect.width * 0.42);
            solarSun.y = rect.height / 2 + Math.sin(solarSun.angle * 0.8) * (rect.height * 0.38);

            factions.forEach(f => {
                if (f.hp <= 0) return;
                const dist = Math.hypot(f.x - solarSun.x, f.y - solarSun.y);
                if (dist < solarSun.radius + 70) {
                    const heal = Math.floor(Math.random() * 120 + 50);
                    f.hp = Math.min(f.maxHp, f.hp + heal);
                    f.sunBonus += heal;
                }
            });
        }

        function drawSolarSun() {
            ctx.save();
            const r = solarSun.radius + Math.sin(solarSun.pulse) * 12;
            const sunGlow = ctx.createRadialGradient(solarSun.x, solarSun.y, 5, solarSun.x, solarSun.y, r + 110);
            sunGlow.addColorStop(0, '#ffffff');
            sunGlow.addColorStop(0.2, '#00ffff');
            sunGlow.addColorStop(0.5, 'rgba(0, 255, 204, 0.5)');
            sunGlow.addColorStop(1, 'transparent');

            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(solarSun.x, solarSun.y, r + 110, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(solarSun.x, solarSun.y, r + 25, (r + 25) * 0.35, solarSun.pulse, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // USPORENI MONSTRUMI SA -25% DAMAGE-A
        class SlowDrone {
            constructor() { this.reset(); }
            reset() {
                const rect = canvas.parentElement.getBoundingClientRect();
                this.x = rect.width / 2 + (Math.random() - 0.5) * 80;
                this.y = rect.height / 2 + (Math.random() - 0.5) * 80;
                // Usporavanje kretanja
                this.speed = Math.random() * 1.0 + 0.6;
                this.angle = Math.random() * Math.PI * 2;
                this.pickTarget();
            }
            pickTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) this.target = alive[Math.floor(Math.random() * alive.length)];
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.pickTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    this.angle = Math.atan2(dy, dx);
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 20) {
                        // Smanjen damage za 25% (ranije 200-800, sada 150-525)
                        const dmg = Math.floor((Math.random() * 500 + 150) * 0.75);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.drawImage(droneImg, -14, -14, 28, 28);
                ctx.restore();
            }
        }
        const drones = Array.from({ length: 10 }, () => new SlowDrone());

        // 3D BOSS TITAN (Izlazi na 60 sec)
        const boss = { active: false, x: 0, y: 0, hp: 1000000, maxHp: 1000000, angle: 0 };
        function spawnBoss() {
            const rect = canvas.parentElement.getBoundingClientRect();
            boss.x = rect.width / 2;
            boss.y = rect.height / 2;
            boss.hp = 1000000;
            boss.active = true;
            bossStatusDisplay.innerText = 'BOSS: 5D SAJBER TITAN';
            bossStatusDisplay.style.color = '#ff0055';
            logMessage('[5D PROCEP] 5D Sajber Titan sa 1M HP ušao je u bitku!');
        }

        function updateBoss() {
            if (!boss.active) return;
            boss.angle += 0.03;

            factions.forEach(f => {
                if (f.hp > 0 && Math.random() < 0.35) {
                    const dmg = Math.floor(Math.random() * 1200 + 500);
                    f.hp = Math.max(0, f.hp - dmg);
                    beams.push({ sx: boss.x, sy: boss.y, tx: f.x, ty: f.y, color: '#ff0055', alpha: 1, width: 3 });
                }
                if (f.hp > 0 && Math.random() < 0.25) {
                    const counterDmg = Math.floor(Math.random() * 2500 + 800);
                    boss.hp -= counterDmg;
                    beams.push({ sx: f.x, sy: f.y, tx: boss.x, ty: boss.y, color: f.color, alpha: 1, width: 2 });
                }
            });

            if (boss.hp <= 0) {
                boss.active = false;
                bossStatusDisplay.innerText = 'BOSS: DESTRUISAN';
                bossStatusDisplay.style.color = '#00ffcc';
                logMessage('[BOSS UNIŠTEN] 5D Sajber Titan je eliminisan!');
            }
        }

        function drawBoss() {
            if (!boss.active) return;
            ctx.save();
            ctx.translate(boss.x, boss.y);
            const size = 28;
            const a = boss.angle;

            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0055';
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.strokeRect(-size * Math.cos(a), -size * Math.sin(a), size * 2, size * 2);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();

            // HP Bar
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(-40, -50, (boss.hp / boss.maxHp) * 80, 6);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(-40, -50, 80, 6);
            ctx.restore();
        }

        // Ratni Engine
        let beams = [];
        function runWarEngine() {
            if (Math.random() < 0.25) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;
                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    const dmg = Math.floor(Math.random() * 1800 + 400);
                    tgt.hp = Math.max(0, tgt.hp - dmg);
                    beams.push({ sx: src.x, sy: src.y, tx: tgt.x, ty: tgt.y, color: src.color, alpha: 1, width: 2 });
                }
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 8) consoleLog.removeChild(consoleLog.lastChild);
        }

        function drawBases() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.translate(f.x, f.y);

                ctx.shadowBlur = 18;
                ctx.shadowColor = f.color;
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = f.color;

                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(-14, 8);
                ctx.lineTo(14, 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.globalAlpha = 1.0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -24);
                ctx.restore();
            });
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';
            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `<span><b>${rank + 1}</b> ${f.name}</span><span style="color:${f.color}">${Math.floor(f.hp)}</span>`;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${Math.floor(selectedFaction.hp)}`;
                document.getElementById('stat-sun').innerText = `+${Math.floor(selectedFaction.sunBonus)} HP`;
                document.getElementById('stat-meta').innerText = selectedFaction.hp > 0 ? 'Aktivno' : 'Uništeno';
            }
        }

        function loop() {
            const rect = canvas.parentElement.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            draw5DMultiverseEnvironment();
            updateSolarSun();
            drawSolarSun();
            updateBoss();
            drawBoss();
            runWarEngine();

            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = b.width || 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
                ctx.restore();
                b.alpha -= 0.05;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            drones.forEach(d => { d.update(); d.draw(); });
            drawBases();
            updateUI();
            requestAnimationFrame(loop);
        }

        // Smena Napadačkih Faktora na 4 sec
        setInterval(() => {
            currentFactor = attackFactors[Math.floor(Math.random() * attackFactors.length)];
            factorDisplay.innerText = `FAKTOR: ${currentFactor.name}`;
            
            factions.forEach(f => {
                if (f.hp > 0) {
                    const dmg = Math.floor((Math.random() * currentFactor.dmg) + 400);
                    f.hp = Math.max(0, f.hp - dmg);
                }
            });
            logMessage(`[SPOLJAŠNJI NAPAD] ${currentFactor.msg}`);
        }, 4000);

        // Tajmer 06:30
        let matchTime = 390;
        const timerInterval = setInterval(() => {
            matchTime--;
            const m = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const s = String(matchTime % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;

            if (matchTime % 60 === 0 && matchTime > 0) {
                spawnBoss();
            }

            if (matchTime <= 0) {
                clearInterval(timerInterval);
                logMessage('[KRAJ SIMULACIJE] 5D Multiverzum partija je završena!');
            }
        }, 1000);

        loop();
    </script>
</body>
</html>
