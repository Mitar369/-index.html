<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>10 SYSTEMS - MULTI-DIMENSIONAL WAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010804;
            color: #00ff66;
        }
        #game-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #sidebar {
            width: 180px;
            min-width: 150px;
            background: rgba(3, 14, 8, 0.95);
            border-right: 1px solid #00ff6633;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 10px;
            font-weight: bold;
            padding: 6px;
            border-bottom: 1px solid #00ff6633;
            color: #00ff66;
            text-align: center;
            background: rgba(0, 255, 102, 0.05);
        }
        #leaderboard {
            list-style: none;
            padding: 2px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            margin-bottom: 2px;
            background: rgba(0, 255, 102, 0.02);
            border-left: 3px solid transparent;
            font-size: 9px;
            cursor: pointer;
        }
        #main-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            width: calc(100vw - 180px);
        }
        #top-bar {
            min-height: 40px;
            background: rgba(3, 14, 8, 0.95);
            border-bottom: 1px solid #00ff6633;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 2px 10px;
            font-size: 9px;
            z-index: 5;
        }
        #titan-mind-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #00ffff 0%, #000000 50%, #ff0055 100%);
            border: 1px solid #00ff6655;
            position: relative;
            margin-top: 2px;
        }
        #titan-pointer {
            position: absolute;
            top: -2px;
            left: 50%;
            width: 4px;
            height: 14px;
            background: #fff;
            box-shadow: 0 0 8px #fff;
            transform: translateX(-50%);
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 80px;
            background: rgba(3, 14, 8, 0.95);
            border-top: 1px solid #00ff6633;
            display: flex;
            padding: 4px 8px;
            gap: 8px;
            font-size: 9px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00dd55;
        }
        #stats-panel {
            width: 180px;
            border-left: 1px dashed #00ff6633;
            padding-left: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        @media (max-width: 600px) {
            #sidebar { width: 120px; min-width: 120px; }
            #main-area { width: calc(100vw - 120px); }
            .faction-row { font-size: 8px; padding: 2px; }
            #stats-panel { width: 120px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">10 SYSTEMS - WAR</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div id="dim-info" style="color:#00ffff;">DIM 3: EVENT HORIZON MIND</div>
                <div id="factor-display" style="color: #ffcc00; font-weight: bold;">Faktor: Tropska Oluja</div>
                <div id="timer-display" style="color: #00ff66;">00:00 / 06:00</div>
                <div id="titan-mind-bar">
                    <div id="titan-pointer"></div>
                </div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; color:#fff;" id="stat-name">Baza</div>
                    <div>HP: <span id="stat-hp">-</span></div>
                    <div>Meta-AI: <span id="stat-meta">-</span></div>
                    <div>Eko-Rast: <span id="stat-eco">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');
        const factorDisplay = document.getElementById('factor-display');

        // Monstrum JPG slika
        const monsterImg = new Image();
        monsterImg.src = 'monster.jpg';

        function fitCanvasResolution() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
        }

        // 33 Spoljašnja Faktora
        const factors = [
            { name: 'Tropska Oluja', eco: 0.8, heal: 0.5, dmg: 1.2 },
            { name: 'Solarna Baklja', eco: 1.5, heal: 0.0, dmg: 1.8 },
            { name: 'Kisele Kiše', eco: 0.5, heal: 0.2, dmg: 1.5 },
            { name: 'Kvantni Skok', eco: 2.0, heal: 2.0, dmg: 0.5 },
            { name: 'Džungla Raste', eco: 1.2, heal: 1.5, dmg: 0.8 },
            { name: 'Ekološki Kolaps', eco: 0.2, heal: 0.1, dmg: 2.0 },
            { name: 'Magnetski Poremećaj', eco: 0.7, heal: 0.8, dmg: 1.1 },
            { name: 'Resetovanje Mreže', eco: 1.0, heal: 1.0, dmg: 1.0 },
            { name: 'Infeckcija Zverima', eco: 0.6, heal: 0.4, dmg: 2.2 },
            { name: 'Supernova Radiacija', eco: 2.5, heal: 0.0, dmg: 2.5 },
            { name: 'Mesečeva Plima', eco: 1.1, heal: 1.3, dmg: 0.9 },
            { name: 'Aura Svetla', eco: 1.3, heal: 3.0, dmg: 0.3 },
            { name: 'Tamni Horizont', eco: 0.4, heal: 0.0, dmg: 2.8 },
            { name: 'Hiper-Kondenzacija', eco: 1.4, heal: 1.4, dmg: 1.0 },
            { name: 'Vremenski Procep', eco: 1.8, heal: 1.1, dmg: 1.3 },
            { name: 'Kvantna Magla', eco: 0.9, heal: 0.9, dmg: 0.9 },
            { name: 'Sajber Korupcija', eco: 0.3, heal: 0.5, dmg: 1.7 },
            { name: 'Procvat Resursa', eco: 3.0, heal: 1.2, dmg: 0.6 },
            { name: 'Gromoviti Udori', eco: 0.8, heal: 0.3, dmg: 1.9 },
            { name: 'Ledena Džungla', eco: 0.5, heal: 0.6, dmg: 1.2 },
            { name: 'Tektonski Potres', eco: 0.6, heal: 0.4, dmg: 1.6 },
            { name: 'Kolektivna Svest', eco: 1.5, heal: 1.5, dmg: 0.7 },
            { name: 'Napad Parazita', eco: 0.4, heal: 0.2, dmg: 2.1 },
            { name: 'Eterična Snaga', eco: 1.7, heal: 2.2, dmg: 0.8 },
            { name: 'Nulta Gravitacija', eco: 1.2, heal: 1.0, dmg: 0.5 },
            { name: 'Nuklearni Vetar', eco: 0.1, heal: 0.0, dmg: 3.0 },
            { name: 'Nano-Regeneracija', eco: 2.2, heal: 4.0, dmg: 0.2 },
            { name: 'Svetlosni Talas', eco: 1.6, heal: 2.5, dmg: 0.5 },
            { name: 'Sena Titana', eco: 0.5, heal: 0.2, dmg: 2.0 },
            { name: 'Džungla U Plamenu', eco: 0.3, heal: 0.1, dmg: 2.4 },
            { name: 'Kozmička Harminija', eco: 2.0, heal: 2.0, dmg: 0.5 },
            { name: 'Protok Podataka', eco: 1.9, heal: 1.1, dmg: 1.1 },
            { name: 'Apsolutna Tišina', eco: 1.0, heal: 1.0, dmg: 0.0 }
        ];

        let currentFactor = factors[0];

        // Frakcije sa Metakognicijom (AI adaptivna logika)
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: 85000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Napad', target: null },
            { id: 1, name: 'ORION', color: '#3399ff', hp: 74000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Odbrana', target: null },
            { id: 2, name: 'ZEPHYR', color: '#33ff66', hp: 63000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Ekspanzija', target: null },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: 58000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Napad', target: null },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: 51000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Regeneracija', target: null },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: 45000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Odbrana', target: null },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: 36000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Napad', target: null },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: 31000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Regeneracija', target: null },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: 25000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Balans', target: null },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: 18000, maxHp: 100000, x: 0, y: 0, eco: 100, meta: 'Krijumčarenje', target: null }
        ];

        function initPositions() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 2.8);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 2.8);
            });
        }

        window.addEventListener('resize', () => {
            fitCanvasResolution();
            initPositions();
        });
        fitCanvasResolution();
        initPositions();

        // JPG Monstrumi umesto crvenih tačkica
        class JPGMonster {
            constructor() { this.reset(); }
            reset() {
                const rect = canvas.parentElement.getBoundingClientRect();
                this.x = rect.width / 2 + (Math.random() - 0.5) * 60;
                this.y = rect.height / 2 + (Math.random() - 0.5) * 60;
                this.speed = Math.random() * 1.5 + 0.8;
                this.size = 18;
                this.pickTarget();
            }
            pickTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) this.target = alive[Math.floor(Math.random() * alive.length)];
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.pickTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 15) {
                        const dmg = Math.floor((Math.random() * 400 + 150) * currentFactor.dmg);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        logMessage(`[MONSTRUM] Napao ${this.target.name} (-${dmg} HP)`);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.save();
                if (monsterImg.complete && monsterImg.naturalWidth !== 0) {
                    ctx.drawImage(monsterImg, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                } else {
                    // Fallback Render Monstruma
                    ctx.fillStyle = '#ff0033';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff0033';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        const monsters = Array.from({ length: 12 }, () => new JPGMonster());

        // Dimenzija 3: Titan Mind (Svetlo vs Mrak)
        let titanBalance = 50; // 0 (Mrak) do 100 (Svetlo)
        function updateTitanMind() {
            titanBalance += (Math.random() - 0.5) * 2;
            titanBalance = Math.max(0, Math.min(100, titanBalance));
            document.getElementById('titan-pointer').style.left = `${titanBalance}%`;
        }

        // Metakognicija (Adaptivna AI logike)
        function updateMetaCognition() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                
                // Regeneracija i rast ekonomije na osnovu spoljašnjeg faktora
                f.eco += 0.1 * currentFactor.eco;
                if (currentFactor.heal > 0 && f.hp < f.maxHp) {
                    f.hp = Math.min(f.maxHp, f.hp + (10 * currentFactor.heal));
                }

                // AI procena stanja
                if (f.hp < 30000) f.meta = 'Odbrana';
                else if (f.eco > 150) f.meta = 'Napad';
                else if (titanBalance > 70) f.meta = 'Regeneracija';
                else f.meta = 'Balans';
            });
        }

        // Borbeni napadi
        let beams = [];
        function runBattles() {
            if (Math.random() < 0.1) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;

                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    const dmg = Math.floor((Math.random() * 600 + 200) * currentFactor.dmg);
                    tgt.hp = Math.max(0, tgt.hp - dmg);
                    src.target = tgt.name;

                    beams.push({ sx: src.x, sy: src.y, tx: tgt.x, ty: tgt.y, color: src.color, alpha: 1 });
                    logMessage(`[METAKOGNICIJA] ${src.name} (${src.meta}) $\rightarrow$ ${tgt.name} (-${dmg} HP)`);
                }
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 8) consoleLog.removeChild(consoleLog.lastChild);
        }

        // Render petlja
        function drawBackground() {
            const rect = canvas.parentElement.getBoundingClientRect();
            ctx.fillStyle = '#020d06';
            ctx.fillRect(0, 0, rect.width, rect.height);

            // Simulation Grid (Dimenzija 2 Overlay)
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x < rect.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
            }
            for (let y = 0; y < rect.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
            }
        }

        function drawBases() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.translate(f.x, f.y);

                ctx.shadowBlur = 10;
                ctx.shadowColor = f.color;
                ctx.fillStyle = '#08170d';
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 8px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -16);
                ctx.restore();
            });
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';
            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `<span><b>${rank + 1}</b> ${f.name}</span><span style="color:${f.color}">${Math.floor(f.hp)}</span>`;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${Math.floor(selectedFaction.hp)}`;
                document.getElementById('stat-meta').innerText = selectedFaction.meta;
                document.getElementById('stat-eco').innerText = `${Math.floor(selectedFaction.eco)}`;
            }
        }

        function loop() {
            drawBackground();
            updateTitanMind();
            updateMetaCognition();
            runBattles();

            // Laseri
            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
                ctx.restore();
                b.alpha -= 0.05;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            // JPG Monstrumi
            monsters.forEach(m => { m.update(); m.draw(); });

            drawBases();
            updateUI();
            requestAnimationFrame(loop);
        }

        // Rotacija 33 Spoljašnja Faktora na svakih 5 sekundi
        setInterval(() => {
            currentFactor = factors[Math.floor(Math.random() * factors.length)];
            factorDisplay.innerText = `Faktor: ${currentFactor.name}`;
            logMessage(`[SPOLJAŠNJI FAKTOR] Aktiviran: ${currentFactor.name}`);
        }, 5000);

        // Tajmer
        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s} / 06:00`;
        }, 1000);

        loop();
    </script>
</body>
</html>
