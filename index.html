<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Elemental Conquest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0e14;color:#f4f7fb;font-family:Arial,sans-serif;overflow:hidden}
body{touch-action:none}
button{border:1px solid #69d2ff;background:#1a3a4a;color:#69d2ff;padding:10px 15px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px}
button:disabled{opacity:0.3;cursor:not-allowed}
.statusBar{position:fixed;top:0;left:0;right:0;height:70px;background:#0a0e14;border-bottom:2px solid #69d2ff;z-index:100;padding:10px;display:flex;justify-content:space-between;align-items:center}
.statusLeft{display:flex;gap:20px;align-items:center}
.playerStatus{background:rgba(105,210,255,0.1);padding:10px 15px;border-radius:6px;border:1px solid #69d2ff}
.playerStatus.active{background:rgba(102,227,154,0.2);border-color:#66e39a}
.playerName{font-size:12px;font-weight:bold}
.playerTerr{font-size:11px;color:#9da8b8}
.resources{display:flex;gap:10px;align-items:center}
.resource{display:flex;align-items:center;gap:5px;font-size:12px}
.gameCanvas{position:fixed;top:70px;left:0;right:0;bottom:150px}
#canvas{width:100%;height:100%;background:#0f1419}
.controlPanel{position:fixed;bottom:0;left:0;right:0;height:150px;background:#0a0e14;border-top:2px solid #69d2ff;padding:15px;overflow-y:auto}
.diceSection{text-align:center;margin-bottom:10px}
.diceDisplay{display:inline-block;width:60px;height:60px;background:#69d2ff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#000;margin:0 10px}
.actionMsg{font-size:12px;color:#9da8b8;margin:8px 0}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.startScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0a0e14 0%,#1a3a4a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:20px;text-align:center}
.startScreen.hidden{display:none}
.startScreen h1{font-size:40px;color:#69d2ff;margin-bottom:10px}
.startScreen p{font-size:14px;color:#9da8b8;margin-bottom:20px}
.startBtn{padding:15px 40px;font-size:16px;background:#69d2ff;color:#000;font-weight:bold;border:none}
.gameOverScreen{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:200;text-align:center;flex-direction:column;gap:20px}
.gameOverScreen.hidden{display:none}
.gameOverScreen h1{font-size:36px;color:#66e39a}
.gameOverScreen p{font-size:14px;color:#9da8b8}
</style>
</head>
<body>

<div class="startScreen" id="startScreen">
    <h1>⚔️ ELEMENTAL CONQUEST</h1>
    <p>Roll dice, claim territories, become champion!</p>
    <button class="startBtn" onclick="startGame()">START GAME</button>
</div>

<div class="gameOverScreen hidden" id="gameOverScreen">
    <h1 id="winnerText">Winner!</h1>
    <p id="winnerDetails"></p>
    <button class="startBtn" onclick="startGame()">NEW GAME</button>
</div>

<div class="statusBar">
    <div class="statusLeft" id="statusLeft"></div>
    <div class="resources" id="resourcesDisplay"></div>
</div>

<div class="gameCanvas">
    <canvas id="canvas"></canvas>
</div>

<div class="controlPanel">
    <div class="diceSection">
        <div class="diceDisplay" id="diceDisplay">?</div>
        <div class="actionMsg" id="actionMsg">Click ROLL to start your turn</div>
    </div>
    <div class="buttons">
        <button id="rollBtn" onclick="rollDice()">🎲 ROLL</button>
        <button id="buyBtn" onclick="buyTerritory()">🏰 BUY</button>
        <button id="endBtn" onclick="endTurn()">✓ END</button>
    </div>
</div>

<script>
"use strict";

const CONFIG = {
    BOARD_SIZE: 24,
    WIN_TERRITORIES: 8,
    WIN_RESOURCES: 3000,
    TERRITORY_COST: 150,
};

const GAME = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    running: false,
    turn: 0,
    currentPlayer: 0,
    lastRoll: 0,
    canRoll: true,
    canBuy: false,
};

const PLAYERS = [
    {name: "You", color: "#69d2ff", pos: 0, territories: new Set(), gold: 800, ai: false},
    {name: "AI-1", color: "#ff6262", pos: 0, territories: new Set(), gold: 800, ai: true},
    {name: "AI-2", color: "#8b7d4a", pos: 0, territories: new Set(), gold: 800, ai: true},
    {name: "AI-3", color: "#66e39a", pos: 0, territories: new Set(), gold: 800, ai: true},
];

const TILES = [];

function initGame() {
    GAME.canvas = document.getElementById('canvas');
    GAME.ctx = GAME.canvas.getContext('2d');
    resizeCanvas();
    generateBoard();
    window.addEventListener('resize', resizeCanvas);
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    const container = document.querySelector('.gameCanvas');
    GAME.width = container.clientWidth;
    GAME.height = container.clientHeight;
    GAME.canvas.width = GAME.width;
    GAME.canvas.height = GAME.height;
}

function generateBoard() {
    TILES.length = 0;
    const resources = [100, 80, 120, 90, 110, 85, 95, 105, 100, 90, 110, 100];
    
    for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
        const angle = (i / CONFIG.BOARD_SIZE) * Math.PI * 2 - Math.PI / 2;
        const radius = 120;
        TILES.push({
            id: i,
            x: Math.cos(angle) * radius,
            y: Math.sin(angle) * radius,
            owner: null,
            value: resources[i % resources.length],
        });
    }
}

function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    
    PLAYERS.forEach(p => {
        p.pos = 0;
        p.territories.clear();
        p.gold = 800;
    });
    
    GAME.turn = 1;
    GAME.currentPlayer = 0;
    GAME.running = true;
    GAME.lastRoll = 0;
    GAME.canRoll = true;
    GAME.canBuy = false;
    
    generateBoard();
    updateUI();
    
    if (PLAYERS[0].ai) aiTurn();
}

function rollDice() {
    if (!GAME.running || !GAME.canRoll) return;
    
    GAME.canRoll = false;
    GAME.canBuy = true;
    
    const roll = Math.floor(Math.random() * 6) + 1;
    GAME.lastRoll = roll;
    
    const player = PLAYERS[GAME.currentPlayer];
    player.pos = (player.pos + roll) % CONFIG.BOARD_SIZE;
    
    const tile = TILES[player.pos];
    
    document.getElementById('diceDisplay').textContent = roll;
    
    if (tile.owner === null) {
        document.getElementById('actionMsg').textContent = `Rolled ${roll}! Land on empty tile. Buy it?`;
    } else if (tile.owner === GAME.currentPlayer) {
        const income = tile.value;
        player.gold += income;
        document.getElementById('actionMsg').textContent = `Rolled ${roll}! Your tile. +${income}g income`;
        GAME.canBuy = false;
    } else {
        document.getElementById('actionMsg').textContent = `Rolled ${roll}! Enemy tile. No action.`;
        GAME.canBuy = false;
    }
    
    updateUI();
}

function buyTerritory() {
    if (!GAME.running || !GAME.canBuy) return;
    
    const player = PLAYERS[GAME.currentPlayer];
    const tile = TILES[player.pos];
    
    if (tile.owner !== null) {
        document.getElementById('actionMsg').textContent = "Territory already owned!";
        return;
    }
    
    const cost = CONFIG.TERRITORY_COST;
    if (player.gold < cost) {
        document.getElementById('actionMsg').textContent = "Not enough gold!";
        return;
    }
    
    player.gold -= cost;
    tile.owner = GAME.currentPlayer;
    player.territories.add(tile.id);
    GAME.canBuy = false;
    
    document.getElementById('actionMsg').textContent = `Territory claimed! ${player.territories.size}/${CONFIG.WIN_TERRITORIES}`;
    updateUI();
    checkWin();
}

function endTurn() {
    if (!GAME.running) return;
    
    const player = PLAYERS[GAME.currentPlayer];
    
    player.territories.forEach(tileId => {
        player.gold += TILES[tileId].value;
    });
    
    GAME.currentPlayer = (GAME.currentPlayer + 1) % 4;
    GAME.turn++;
    GAME.lastRoll = 0;
    GAME.canRoll = true;
    GAME.canBuy = false;
    
    document.getElementById('diceDisplay').textContent = '?';
    document.getElementById('actionMsg').textContent = `${PLAYERS[GAME.currentPlayer].name}'s turn`;
    
    updateUI();
    
    if (PLAYERS[GAME.currentPlayer].ai) {
        setTimeout(aiTurn, 1500);
    }
}

function aiTurn() {
    if (!GAME.running || !PLAYERS[GAME.currentPlayer].ai) return;
    
    rollDice();
    
    setTimeout(() => {
        const player = PLAYERS[GAME.currentPlayer];
        const tile = TILES[player.pos];
        
        if (GAME.canBuy && tile.owner === null && player.gold >= CONFIG.TERRITORY_COST) {
            buyTerritory();
            setTimeout(endTurn, 800);
        } else {
            endTurn();
        }
    }, 1200);
}

function checkWin() {
    for (let i = 0; i < PLAYERS.length; i++) {
        const player = PLAYERS[i];
        const totalRes = player.gold + (player.territories.size * 100);
        
        if (player.territories.size >= CONFIG.WIN_TERRITORIES || totalRes >= CONFIG.WIN_RESOURCES) {
            GAME.running = false;
            
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('winnerText').textContent = `🏆 ${player.name} WINS!`;
            document.getElementById('winnerDetails').textContent = `Territories: ${player.territories.size} | Gold: ${player.gold}`;
        }
    }
}

function updateUI() {
    const statusLeft = document.getElementById('statusLeft');
    statusLeft.innerHTML = '';
    
    PLAYERS.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = `playerStatus ${i === GAME.currentPlayer ? 'active' : ''}`;
        el.innerHTML = `<div class="playerName">${p.name}</div><div class="playerTerr">🏰 ${p.territories.size}</div>`;
        statusLeft.appendChild(el);
    });
    
    const player = PLAYERS[GAME.currentPlayer];
    const resourcesDisplay = document.getElementById('resourcesDisplay');
    resourcesDisplay.innerHTML = `<div class="resource">💰 ${player.gold}g</div>`;
    
    document.getElementById('rollBtn').disabled = !GAME.canRoll;
    document.getElementById('buyBtn').disabled = !GAME.canBuy;
}

function render() {
    const ctx = GAME.ctx;
    const w = GAME.width;
    const h = GAME.height;
    
    ctx.fillStyle = '#0f1419';
    ctx.fillRect(0, 0, w, h);
    
    const cx = w / 2;
    const cy = h / 2;
    
    ctx.strokeStyle = '#69d2ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 120, 0, Math.PI * 2);
    ctx.stroke();
    
    TILES.forEach(tile => {
        const x = cx + tile.x;
        const y = cy + tile.y;
        
        if (tile.owner !== null) {
            ctx.fillStyle = PLAYERS[tile.owner].color;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        
        ctx.strokeStyle = '#69d2ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tile.id + 1, x, y);
    });
    
    PLAYERS.forEach(player => {
        const tile = TILES[player.pos];
        const x = cx + tile.x;
        const y = cy + tile.y;
        
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(x, y - 25, 6, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    render();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('load', initGame);
</script>

</body>
</html>
