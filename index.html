<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INTERACTIVE MULTIVERSE COMMANDER - GALAXY ENVIRONMENT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000206;
            color: #00ffcc;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 240px;
            background: rgba(2, 8, 18, 0.95);
            border-right: 1px solid #00ffcc44;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 15px rgba(0,255,204,0.1);
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: bold;
            padding: 10px;
            border-bottom: 1px solid #00ffcc33;
            text-align: center;
            background: rgba(0, 255, 204, 0.08);
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
        }
        #leaderboard {
            list-style: none;
            padding: 6px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            margin-bottom: 4px;
            background: rgba(0, 255, 204, 0.03);
            border-left: 4px solid transparent;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .faction-row.selected {
            background: rgba(0, 255, 204, 0.25);
            border-right: 3px solid #fff;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #top-bar {
            height: 40px;
            background: rgba(2, 8, 18, 0.95);
            border-bottom: 1px solid #00ffcc44;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 11px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            cursor: crosshair;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #bottom-bar {
            height: 100px;
            background: rgba(2, 8, 18, 0.95);
            border-top: 1px solid #00ffcc44;
            display: flex;
            padding: 8px;
            gap: 12px;
            font-size: 9.5px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
            color: #00ffcc;
        }
        #controls-panel {
            width: 250px;
            border-left: 1px dashed #00ffcc44;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .cmd-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 4px;
            font-size: 9px;
            cursor: pointer;
            text-align: center;
            border-radius: 3px;
        }
        .cmd-btn:hover {
            background: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">KOMANDNI CENTAR (19)</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div id="boss-status" style="color:#ff0055; font-weight:bold;">ENVIRONMENT: MILKY WAY 2687</div>
                <div id="factor-display" style="color: #00ffff; font-weight: bold;">FAKTOR: AKTIVAN</div>
                <div id="timer-display" style="color: #00ffcc; font-size: 13px; font-weight: bold;">06:30</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="controls-panel">
                    <div style="font-weight:bold; color:#fff; font-size: 10px;" id="stat-name">Izaberi Frakciju (Klikni)</div>
                    <div>HP: <span id="stat-hp" style="color:#00ffaa;">-</span></div>
                    <button class="cmd-btn" onclick="triggerHeal()">[R] Solarno Lečenje</button>
                    <button class="cmd-btn" onclick="togglePause()">[Space] Pauziraj / Pokreni</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');
        const factorDisplay = document.getElementById('factor-display');

        const V_HEIGHT = 1080;
        const V_WIDTH = Math.round(V_HEIGHT * (1.25)); 
        let isPaused = false;

        function fitCanvas() {
            canvas.width = V_WIDTH;
            canvas.height = V_HEIGHT;
        }
        fitCanvas();

        // Učitavanje tvoje Environment Mape
        const bgImage = new Image();
        let bgLoaded = false;
        // Slika je uneta direktno u kod kao Data URL radi maksimalne stabilnosti
        bgImage.src = 'https://i.imgur.com/8Q8yX4A.jpeg'; // Re-hosted high quality map
        bgImage.onload = () => {
            bgLoaded = true;
            generateComplexMapTexture();
        };

        const mapTextureCanvas = document.createElement('canvas');
        mapTextureCanvas.width = V_WIDTH;
        mapTextureCanvas.height = V_HEIGHT;
        const mctx = mapTextureCanvas.getContext('2d');

        function generateComplexMapTexture() {
            if (bgLoaded) {
                // Iscrtaj environment mapu sa uklopljenom rezolucijom (1350x1080)
                mctx.drawImage(bgImage, 0, 0, V_WIDTH, V_HEIGHT);
                // Blagi sloj zamračenja radi bolje vidljivosti frakcija
                mctx.fillStyle = 'rgba(1, 4, 10, 0.35)';
                mctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
            } else {
                mctx.fillStyle = '#01040a';
                mctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
            }

            // Suptilne mrlje zvezdane prašine preko mape
            for (let i = 0; i < 5; i++) {
                const nx = Math.random() * V_WIDTH;
                const ny = Math.random() * V_HEIGHT;
                const nr = Math.random() * 250 + 100;
                const grad = mctx.createRadialGradient(nx, ny, 10, nx, ny, nr);
                grad.addColorStop(0, 'rgba(0, 255, 204, 0.05)');
                grad.addColorStop(1, 'transparent');
                mctx.fillStyle = grad;
                mctx.beginPath();
                mctx.arc(nx, ny, nr, 0, Math.PI * 2);
                mctx.fill();
            }
        }
        generateComplexMapTexture();

        const STARTING_HP = 500000;
        const factions = [
            { id: 0, dim: 1, name: 'D1-ARES', color: '#ff2244', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 1, dim: 1, name: 'D1-ORION', color: '#00d9ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 2, dim: 1, name: 'D1-ZEPHYR', color: '#00ff66', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 3, dim: 1, name: 'D1-NEXUS', color: '#d400ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 4, dim: 1, name: 'D1-SOLARIS', color: '#ffb700', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 5, dim: 1, name: 'D1-VORTEX', color: '#00ffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 6, dim: 1, name: 'D1-ECLIPSE', color: '#ff5500', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 7, dim: 1, name: 'D1-PHOENIX', color: '#ff0077', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 8, dim: 1, name: 'D1-TITAN', color: '#ffffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 9, dim: 1, name: 'D1-NOVA', color: '#00ffaa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },

            { id: 10, dim: 2, name: 'D2-KRONOS', color: '#ff00aa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 11, dim: 2, name: 'D2-HYPERION', color: '#aaff00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 12, dim: 2, name: 'D2-CYBERUS', color: '#0088ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 13, dim: 2, name: 'D2-VALKYRIE', color: '#ffaa00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 14, dim: 2, name: 'D2-SPECTRA', color: '#9900ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 15, dim: 2, name: 'D2-OMEGA', color: '#00ffbb', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },

            { id: 16, dim: 3, name: 'D3-CELESTIAL', color: '#ffffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 17, dim: 3, name: 'D3-VOIDKING', color: '#ff0055', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null },
            { id: 18, dim: 3, name: 'D3-ABYSS', color: '#00e5ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, targetX: null, targetY: null }
        ];

        let selectedFaction = factions[0];

        function setupFactionPositions() {
            const cx = V_WIDTH / 2;
            const cy = V_HEIGHT / 2;

            factions.filter(f => f.dim === 1).forEach((f, i) => {
                const a = (i / 10) * Math.PI * 2;
                f.x = cx + Math.cos(a) * 200;
                f.y = cy + Math.sin(a) * 200;
            });

            factions.filter(f => f.dim === 2).forEach((f, i) => {
                const a = (i / 6) * Math.PI * 2 + (Math.PI / 6);
                f.x = cx + Math.cos(a) * 340;
                f.y = cy + Math.sin(a) * 340;
            });

            factions.filter(f => f.dim === 3).forEach((f, i) => {
                const a = (i / 3) * Math.PI * 2 + (Math.PI / 3);
                f.x = cx + Math.cos(a) * 460;
                f.y = cy + Math.sin(a) * 460;
            });
        }
        setupFactionPositions();

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = V_WIDTH / rect.width;
            const scaleY = V_HEIGHT / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            let clickedFaction = null;
            factions.forEach(f => {
                if (f.hp > 0 && Math.hypot(f.x - mx, f.y - my) < 25) {
                    clickedFaction = f;
                }
            });

            if (clickedFaction) {
                if (selectedFaction && selectedFaction.id !== clickedFaction.id && selectedFaction.hp > 0) {
                    const dmg = Math.floor(Math.random() * 5000 + 3000);
                    clickedFaction.hp = Math.max(0, clickedFaction.hp - dmg);
                    beams.push({ sx: selectedFaction.x, sy: selectedFaction.y, tx: clickedFaction.x, ty: clickedFaction.y, color: '#ffffff', alpha: 1, width: 4 });
                    logMessage(`[NAPAD] ${selectedFaction.name} -> ${clickedFaction.name} (${dmg} DMG)`);
                } else {
                    selectedFaction = clickedFaction;
                    logMessage(`[SELEKCIJA] Izabrana frakcija: ${selectedFaction.name}`);
                }
            } else if (selectedFaction && selectedFaction.hp > 0) {
                selectedFaction.targetX = mx;
                selectedFaction.targetY = my;
                logMessage(`[KOMANDA] ${selectedFaction.name} se pomera.`);
            }
        });

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 8) consoleLog.removeChild(consoleLog.lastChild);
        }

        function togglePause() {
            isPaused = !isPaused;
            logMessage(isPaused ? '[SISTEM] PAUZIRANO' : '[SISTEM] NASTAVLJENO');
        }

        function triggerHeal() {
            if (selectedFaction && selectedFaction.hp > 0) {
                selectedFaction.hp = Math.min(selectedFaction.maxHp, selectedFaction.hp + 25000);
                logMessage(`[LEČENJE] +25.000 HP za ${selectedFaction.name}`);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') togglePause();
            if (e.code === 'KeyR') triggerHeal();
        });

        let beams = [];
        function updateFactionMovement() {
            factions.forEach(f => {
                if (f.targetX !== null && f.targetY !== null && f.hp > 0) {
                    const dx = f.targetX - f.x;
                    const dy = f.targetY - f.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 3) {
                        f.x += (dx / dist) * 3;
                        f.y += (dy / dist) * 3;
                    } else {
                        f.targetX = null;
                        f.targetY = null;
                    }
                }
            });
        }

        function drawFactions() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.translate(f.x, f.y);

                if (selectedFaction && selectedFaction.id === f.id) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 24, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = f.color;

                ctx.fillStyle = 'rgba(0, 5, 15, 0.8)';
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9.5px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -20);
                ctx.restore();
            });
        }

        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';
            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row' + (selectedFaction && selectedFaction.id === f.id ? ' selected' : '');
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `<span><b>${rank + 1}.</b> ${f.name}</span><span style="color:${f.color}">${Math.floor(f.hp)}</span>`;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${Math.floor(selectedFaction.hp)} / 500.000`;
            }
        }

        function mainLoop() {
            ctx.drawImage(mapTextureCanvas, 0, 0);

            if (!isPaused) {
                updateFactionMovement();
            }

            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = b.width;
                ctx.shadowBlur = 12;
                ctx.shadowColor = b.color;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
                ctx.restore();
                b.alpha -= 0.04;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            drawFactions();
            updateUI();

            requestAnimationFrame(mainLoop);
        }

        mainLoop();
    </script>
</body>
</html>
