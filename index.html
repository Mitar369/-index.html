<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ELEMENTAL LUDO 10x10</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#070b10; color:#d8e2e8; font-family:sans-serif; }
#game{ width:100vw; height:100vh; display:flex; flex-direction:column; }

#top{ height:40px; background:#0e1620; border-bottom:1px solid #1e2c3a; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:12px; }
#main{ flex:1; display:flex; position:relative; overflow:hidden; }

/* MAP AREA */
#mapWrap{ flex:1; background:#04070a; display:flex; justify-content:center; align-items:center; position:relative; }
#map{ display:block; }

/* RIGHT PANEL */
#right{ width:260px; background:#0a1017; border-left:1px solid #1e2c3a; display:flex; flex-direction:column; padding:8px; overflow-y:auto; }
.box{ background:#111a24; padding:8px; border-radius:4px; margin-bottom:8px; border:1px solid #1f2f40; font-size:11px; }
.stat-row{ display:flex; justify-content:space-between; margin-bottom:2px; }

/* DICE BUTTON */
.btn-roll{ width:100%; padding:12px; background:#ffca28; color:#000; font-weight:bold; border:none; border-radius:4px; cursor:pointer; font-size:14px; }
.btn-roll:active{ background:#cca010; }

/* SHOP */
.item-list{ display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto; margin-top:4px; }
.item-card{ background:#14202c; border:1px solid #233446; padding:5px; border-radius:3px; display:flex; justify-content:space-between; cursor:pointer; font-size:10px; }
.item-card:hover{ border-color:#ffca28; }

#bottom{ height:50px; background:#05080c; border-top:1px solid #1e2c3a; padding:6px 12px; font-family:monospace; font-size:10px; color:#8fa3b8; overflow-y:auto; }

@media(max-width:768px){
  #main{ flex-direction:column; }
  #right{ width:100%; height:200px; flex-shrink:0; }
}
</style>
</head>
<body>
<div id="game">
  <header id="top">
    <div><b>LUDO BOARD (10 FRAKCIJA)</b></div>
    <div id="turnTxt" style="font-weight:bold; color:#ffca28;">NA POTEZU: ARES</div>
    <div>RUNDA: <span id="rNum">1</span></div>
  </header>

  <div id="main">
    <main id="mapWrap">
      <canvas id="map"></canvas>
    </main>

    <aside id="right">
      <div class="box" style="text-align:center;">
        <div style="font-size:10px; color:#8095a8;">REZULTAT KOCKICE</div>
        <div id="diceVal" style="font-size:32px; font-weight:bold; color:#ffca28; margin:2px 0;">-</div>
        <button class="btn-roll" onclick="playTurn()">BACI KOCKICU</button>
      </div>

      <div class="box">
        <div class="stat-row"><span>Frakcija:</span><b id="stName">-</b></div>
        <div class="stat-row"><span>Zlato:</span><b id="stGold" style="color:#ffca28;">0 G</b></div>
        <div class="stat-row"><span>HP / Max:</span><b id="stHP">0 / 0</b></div>
        <div class="stat-row"><span>ATK / DEF:</span><b id="stStats">0 / 0</b></div>
      </div>

      <div style="font-size:11px; font-weight:bold; color:#fff; margin-bottom:4px;">PRODAVNICA ITEMA</div>
      <div id="shopList" class="item-list"></div>
    </aside>
  </div>

  <footer id="bottom">
    <div id="log"></div>
  </footer>
</div>

<script>
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let size = 400;

function resize(){
  const wrap = document.getElementById("mapWrap");
  size = Math.min(wrap.clientWidth, wrap.clientHeight) - 20;
  if(size < 280) size = 280;
  canvas.width = size;
  canvas.height = size;
  buildBoardGrid();
}
window.addEventListener("resize", resize);

/* EFEKTI POLJA (SPECIAL TILES) */
const TILE_TYPES = {
  NORMAL: 0,
  GOLD: 1,   // Bonus Zlato
  BUFF: 2,   // Bonus Napad
  PORTAL: 3, // Idi napred
  TRAP: 4    // Zamka
};

const boardNodes = [];
const TOTAL_NODES = 40;

function buildBoardGrid(){
  boardNodes.length = 0;
  const cellSize = size / 11;
  
  // Staza od 40 polja po obodu 11x11 mreže
  const coords = [];
  for(let x=1; x<=9; x++) coords.push({x:x, y:1});
  for(let y=1; y<=9; y++) coords.push({x:9, y:y});
  for(let x=9; x>=1; x--) coords.push({x:x, y:9});
  for(let y=9; y>=1; y--) coords.push({x:1, y:y});

  for(let i=0; i<TOTAL_NODES; i++){
    let type = TILE_TYPES.NORMAL;
    if(i % 8 === 2) type = TILE_TYPES.GOLD;
    else if(i % 8 === 5) type = TILE_TYPES.BUFF;
    else if(i % 10 === 7) type = TILE_TYPES.PORTAL;
    else if(i % 9 === 4) type = TILE_TYPES.TRAP;

    boardNodes.push({
      x: coords[i].x * cellSize + cellSize/2,
      y: coords[i].y * cellSize + cellSize/2,
      gridX: coords[i].x,
      gridY: coords[i].y,
      type: type
    });
  }
}

/* GENERIŠI 50 ITEMA (250G - 5000G) */
function generate50Items(){
  const list = [];
  const prefixes = ["Runic", "Void", "Shadow", "Celestial", "Infernal", "Titan's"];
  const names = ["Blade", "Aegis", "Tome", "Crown", "Heart", "Ring"];
  for(let i=0; i<50; i++){
    const price = Math.round((250 + (i/49)*4750)/10)*10;
    const p = price / 250;
    list.push({
      id: i+1,
      name: `${prefixes[i%prefixes.length]} ${names[i%names.length]} +${i+1}`,
      price: price,
      hp: Math.floor((Math.random()*50 + 25)*p),
      att: Math.floor((Math.random()*8 + 4)*p),
      def: Math.floor((Math.random()*6 + 2)*p)
    });
  }
  return list.sort((a,b) => a.price - b.price);
}
const shopItems = generate50Items();

/* 10 FRAKCIJA I KUĆICE */
const defs = [
  { name:"ARES", color:"#ff3b30", home:{x:0, y:0}, start:0 },
  { name:"TIDAL", color:"#2196f3", home:{x:10, y:0}, start:4 },
  { name:"TERRA", color:"#9c7a4a", home:{x:10, y:10}, start:8 },
  { name:"AERIS", color:"#b8e8ff", home:{x:0, y:10}, start:12 },
  { name:"CRYON", color:"#72e6ff", home:{x:5, y:0}, start:16 },
  { name:"VOLT", color:"#ffff33", home:{x:10, y:5}, start:20 },
  { name:"SYLVAN", color:"#50d66b", home:{x:5, y:10}, start:24 },
  { name:"VOID", color:"#b000ff", home:{x:0, y:5}, start:28 },
  { name:"SOLAR", color:"#ffd54f", start:32, home:{x:2, y:2} },
  { name:"NEXUS", color:"#ff55cc", start:36, home:{x:8, y:8} }
];

let factions = [];
let currentTurn = 0;
let roundCount = 1;
let consecutiveSixes = 0;

function initFactions(){
  factions = defs.map((d, i) => ({
    id: i, name: d.name, color: d.color,
    home: d.home, node: d.start,
    hp: 800, maxHp: 800, gold: 500, attack: 30, defense: 10,
    alive: true
  }));
}

/* IGRA NA POTEZE */
function playTurn(){
  const f = factions[currentTurn];
  if(!f || !f.alive){ nextTurn(); return; }

  const dice = Math.floor(Math.random() * 6) + 1;
  document.getElementById("diceVal").textContent = dice;

  // Pomeranje
  f.node = (f.node + dice) % TOTAL_NODES;
  const tile = boardNodes[f.node];

  // Osnovna zarada
  f.gold += 100 + dice * 20;
  log(`${f.name} bacio [${dice}] -> Polje ${f.node}`);

  // Efekti Polja
  if(tile.type === TILE_TYPES.GOLD){
    f.gold += 200;
    log(`🟡 ${f.name} stao na GOLD POLJE! Bonus +200G!`);
  } else if(tile.type === TILE_TYPES.BUFF){
    f.attack += 15;
    log(`⚔️ ${f.name} stao na BUFF POLJE! +15 Napad!`);
  } else if(tile.type === TILE_TYPES.PORTAL){
    f.node = (f.node + 3) % TOTAL_NODES;
    log(`🌀 ${f.name} stao na PORTAL! Teleportovan +3 polja napred!`);
  } else if(tile.type === TILE_TYPES.TRAP){
    f.hp -= 150;
    log(`💣 ${f.name} JE ULETIOM U ZAMKU! -150 HP!`);
  }

  // Napad na protivnika ako stane na njega
  factions.forEach(target => {
    if(target.id !== f.id && target.alive && target.node === f.node){
      log(`⚔️ NAPAD: ${f.name} je stao na polje frakcije ${target.name}!`);
      const dmg = Math.max(20, f.attack * 1.5 - target.defense * 0.5);
      target.hp -= dmg;
      if(target.hp <= 0){
        target.alive = false;
        f.gold += target.gold;
        log(`☠️ ${f.name} je ELIMINISAO ${target.name}!`);
      }
    }
  });

  // Pravilo za 2 šestice
  if(dice === 6){
    consecutiveSixes++;
    if(consecutiveSixes === 2){
      log(`🔥 DVE ŠESTICE ZAREDOM! ${f.name} igra ponovo!`);
      consecutiveSixes = 0;
      renderUI();
      return;
    }
  } else {
    consecutiveSixes = 0;
  }

  nextTurn();
}

function nextTurn(){
  do {
    currentTurn = (currentTurn + 1) % factions.length;
    if(currentTurn === 0) roundCount++;
  } while(!factions[currentTurn].alive);

  renderUI();
}

function buyItem(item){
  const f = factions[currentTurn];
  if(f.gold < item.price){ log(`Nemaš dovoljno zlata!`); return; }
  f.gold -= item.price;
  f.maxHp += item.hp; f.hp += item.hp;
  f.attack += item.att; f.defense += item.def;
  log(`🛒 ${f.name} kupio ${item.name}!`);
  renderUI();
}

function renderUI(){
  document.getElementById("rNum").textContent = roundCount;
  const curF = factions[currentTurn];
  document.getElementById("turnTxt").textContent = "NA POTEZU: " + curF.name;
  document.getElementById("turnTxt").style.color = curF.color;

  document.getElementById("stName").textContent = curF.name;
  document.getElementById("stGold").textContent = Math.floor(curF.gold) + " G";
  document.getElementById("stHP").textContent = Math.floor(curF.hp) + " / " + Math.floor(curF.maxHp);
  document.getElementById("stStats").textContent = Math.floor(curF.attack) + " / " + Math.floor(curF.defense);

  const shopEl = document.getElementById("shopList");
  shopEl.innerHTML = "";
  shopItems.forEach(item => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `<div><b>${item.name}</b><br><small>HP:+${item.hp} ATK:+${item.att}</small></div><b>${item.price}G</b>`;
    card.onclick = () => buyItem(item);
    shopEl.appendChild(card);
  });
}

function log(msg){
  const b = document.getElementById("log");
  const d = document.createElement("div");
  d.textContent = msg;
  b.prepend(d);
}

/* ISCRTAVANJE ČOVEČE NE LJUTI SE TABLICE */
function draw(){
  ctx.fillStyle = "#04070a";
  ctx.fillRect(0,0,size,size);

  const cellSize = size / 11;

  // Crtanje Kućica (Baza)
  factions.forEach(f => {
    ctx.fillStyle = f.color;
    ctx.globalAlpha = 0.2;
    ctx.fillRect(f.home.x * cellSize, f.home.y * cellSize, cellSize, cellSize);
    ctx.globalAlpha = 1.0;
    ctx.strokeStyle = f.color;
    ctx.strokeRect(f.home.x * cellSize, f.home.y * cellSize, cellSize, cellSize);
  });

  // Crtanje Staze
  boardNodes.forEach((n, i) => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, cellSize/3, 0, Math.PI*2);
    
    if(n.type === TILE_TYPES.GOLD) ctx.fillStyle = "#ffca28";
    else if(n.type === TILE_TYPES.BUFF) ctx.fillStyle = "#ff3b30";
    else if(n.type === TILE_TYPES.PORTAL) ctx.fillStyle = "#2196f3";
    else if(n.type === TILE_TYPES.TRAP) ctx.fillStyle = "#b000ff";
    else ctx.fillStyle = "#162332";

    ctx.fill();
    ctx.strokeStyle = "#2c3e50";
    ctx.stroke();
  });

  // Crtanje Figurica
  factions.forEach(f => {
    if(!f.alive) return;
    const n = boardNodes[f.node];
    
    ctx.beginPath();
    ctx.arc(n.x, n.y, cellSize/2.5, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.strokeStyle = f.id === currentTurn ? "#ffffff" : "#000000";
    ctx.lineWidth = f.id === currentTurn ? 3 : 1;
    ctx.stroke();
  });

  requestAnimationFrame(draw);
}

resize();
initFactions();
renderUI();
log("Nova Čoveče Ne Ljuti Se mapa je spremna. ARES prvi baca kockicu.");
requestAnimationFrame(draw);
</script>
</body>
</html>
