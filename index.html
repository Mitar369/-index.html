<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GLITCH.EXE — MULTIVERSE WAR ENGINE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    font-family:"Courier New",monospace;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#00ffcc;
}

#game{
    width:100vw;
    height:100vh;
    display:flex;
    background:#000;
}

/* SIDEBAR */
#sidebar{
    width:230px;
    flex-shrink:0;
    background:rgba(2,8,18,.97);
    border-right:1px solid #00ffcc55;
    z-index:20;
    display:flex;
    flex-direction:column;
}

.title{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    color:#fff;
    border-bottom:1px solid #00ffcc44;
    text-shadow:0 0 8px #00ffcc;
}

#leaderboard{
    list-style:none;
    padding:6px;
    overflow-y:auto;
    flex:1;
}

.faction{
    position:relative;
    padding:7px;
    margin-bottom:4px;
    border-left:4px solid;
    background:rgba(0,255,204,.035);
    font-size:9px;
    transition:.15s;
}

.faction:hover{
    background:rgba(0,255,204,.15);
}

.faction-top{
    display:flex;
    justify-content:space-between;
    color:#fff;
}

.hpbar{
    height:4px;
    margin-top:4px;
    background:#111;
}

.hpfill{
    height:100%;
    transition:width .2s;
}

/* MAIN */
#main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

#top{
    height:45px;
    flex-shrink:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(2,8,18,.97);
    border-bottom:1px solid #00ffcc55;
    font-size:11px;
    z-index:10;
}

#timer{
    color:#00ffcc;
    font-size:14px;
    font-weight:bold;
}

#speed{
    color:#fff;
}

#canvasArea{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#000;
}

/*
  KLJUČNI FIX:
  Canvas više NE koristi width:100%;height:100%.
  Zadržava 16:9 odnos i samo se proporcionalno smanjuje
  na mobilnom telefonu.
*/
#warCanvas{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:block;
    background:#000;
}

/* BOTTOM */
#bottom{
    height:100px;
    flex-shrink:0;
    display:flex;
    gap:10px;
    padding:7px;
    background:rgba(2,8,18,.97);
    border-top:1px solid #00ffcc55;
    font-size:9px;
    z-index:10;
}

#console{
    flex:1;
    overflow:hidden;
    color:#00ffcc;
}

.log{
    margin-bottom:3px;
}

#stats{
    width:230px;
    border-left:1px dashed #00ffcc44;
    padding-left:10px;
    line-height:15px;
}

#selectedName{
    font-size:12px;
    font-weight:bold;
    color:#fff;
}

/* MOBILE */
@media(max-width:700px){

    #sidebar{
        width:125px;
    }

    .title{
        font-size:8px;
        height:38px;
    }

    .faction{
        font-size:7px;
        padding:5px;
    }

    #top{
        height:38px;
        font-size:8px;
    }

    #timer{
        font-size:10px;
    }

    #bottom{
        height:80px;
        font-size:7px;
    }
