<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10 SYSTEMS - UNPREDICTABLE WAR SIMULATION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010804;
            color: #00ff66;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 170px;
            background: rgba(3, 14, 8, 0.95);
            border-right: 1px solid #00ff6633;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 10px;
            font-weight: bold;
            padding: 8px;
            border-bottom: 1px solid #00ff6633;
            text-align: center;
            background: rgba(0, 255, 102, 0.05);
        }
        #leaderboard {
            list-style: none;
            padding: 4px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            margin-bottom: 2px;
            background: rgba(0, 255, 102, 0.02);
            border-left: 3px solid transparent;
            font-size: 9px;
            cursor: pointer;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #top-bar {
            height: 35px;
            background: rgba(3, 14, 8, 0.95);
            border-bottom: 1px solid #00ff6633;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 10px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 80px;
            background: rgba(3, 14, 8, 0.95);
            border-top: 1px solid #00ff6633;
            display: flex;
            padding: 4px;
            gap: 6px;
            font-size: 9px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00dd55;
        }
        #stats-panel {
            width: 160px;
            border-left: 1px dashed #00ff6633;
            padding-left: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">RANG-LISTA</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div style="color:#ffcc00; font-weight:bold;">SOLAR SUN: IZLAZAK</div>
                <div id="factor-display" style="color: #00ffff; font-weight: bold;">FAKTOR: Tropska Oluja</div>
                <div id="timer-display" style="color: #00ff66;">00:00</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; color:#fff;" id="stat-name">Baza</div>
                    <div>HP: <span id="stat-hp">-</span></div>
                    <div>Solarni Efekat: <span id="stat-sun">-</span></div>
                    <div>Taktika: <span id="stat-meta">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');
        const factorDisplay = document.getElementById('factor-display');

        // Generisanje JPG Teksture za Monstrume (Base64)
        const monsterImg = new Image();
        monsterImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="%23110000"/><polygon points="16,2 6,30 26,30" fill="%23ff0033"/><circle cx="12" cy="14" r="3" fill="%23ffff00"/><circle cx="20" cy="14" r="3" fill="%23ffff00"/><path d="M10 22 Q16 28 22 22" stroke="%23ffffff" stroke-width="2" fill="none"/></svg>';

        function fitCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }

        // 33 Dinamička Spoljašnja Faktora
        const factors = [
            { name: 'Tropska Oluja', heal: 0.2, dmg: 1.5, chaos: 0.8 },
            { name: 'Solarni Izbijaj', heal: 3.0, dmg: 0.2, chaos: 1.5 },
            { name: 'Kisele Kiše', heal: -0.5, dmg: 2.0, chaos: 1.1 },
            { name: 'Kvantni Preokret', heal: 1.0, dmg: 1.0, chaos: 3.0 },
            { name: 'Mutacija Zveri', heal: 0.0, dmg: 2.5, chaos: 2.0 },
            { name: 'Ekološki Štit', heal: 2.0, dmg: 0.1, chaos: 0.2 },
            { name: 'Mesečeva Senca', heal: 0.5, dmg: 1.2, chaos: 1.2 },
            { name: 'Hiper-Kondenzacija', heal: 1.5, heal: 1.5, chaos: 0.5 },
            { name: 'Anarhija U Džungli', heal: 0.1, dmg: 3.0, chaos: 2.5 },
            { name: 'Kozmički Zrak', heal: 4.0, dmg: 0.0, chaos: 1.8 }
        ];
        let currentFactor = factors[0];

        // Frakcije
        const factions = [
            { id: 0, name: 'ARES', color: '#ff3344', hp: 85000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Agresivno' },
            { id: 1, name: 'ORION', color: '#3399ff', hp: 74000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Odbrana' },
            { id: 2, name: 'ZEPHYR', color: '#33ff66', hp: 63000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Kamuflaža' },
            { id: 3, name: 'NEXUS', color: '#cc33ff', hp: 58000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Sakupljanje' },
            { id: 4, name: 'SOLARIS', color: '#ffcc00', hp: 51000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Apsorpcija' },
            { id: 5, name: 'VORTEX', color: '#00ffff', hp: 45000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Reakcija' },
            { id: 6, name: 'ECLIPSE', color: '#ff6633', hp: 36000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Zaseda' },
            { id: 7, name: 'PHOENIX', color: '#ff3399', hp: 31000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Regeneracija' },
            { id: 8, name: 'TITAN', color: '#ffffff', hp: 25000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Tvđava' },
            { id: 9, name: 'NOVA', color: '#00ffaa', hp: 18000, maxHp: 100000, x: 0, y: 0, sunBonus: 0, meta: 'Evolucija' }
        ];

        function initPositions() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            factions.forEach((f, i) => {
                const angle = (i / factions.length) * Math.PI * 2;
                f.x = w / 2 + Math.cos(angle) * (Math.min(w, h) / 2.7);
                f.y = h / 2 + Math.sin(angle) * (Math.min(w, h) / 2.7);
            });
        }

        window.addEventListener('resize', () => { fitCanvas(); initPositions(); });
        fitCanvas();
        initPositions();

        // Gigantsko Sunce Koji Izlazi (Solar Sun Entity)
        const solarSun = {
            x: 0,
            y: 0,
            radius: 70,
            pulse: 0,
            riseProgress: 0
        };

        function updateSolarSun() {
            const rect = canvas.parentElement.getBoundingClientRect();
            solarSun.pulse += 0.03;
            solarSun.riseProgress += 0.002;
            
            // Putanja sunca: Izlazi sa dna, kruži preko centra i zalazi
            solarSun.x = rect.width * 0.2 + (Math.sin(solarSun.riseProgress) * rect.width * 0.6);
            solarSun.y = rect.height - (Math.sin(solarSun.riseProgress * 0.8) * rect.height * 0.7);

            const dynamicRadius = solarSun.radius + Math.sin(solarSun.pulse) * 8;

            // Efekat lečenja i uticaja na frakcije
            factions.forEach(f => {
                if (f.hp <= 0) return;
                const dist = Math.hypot(f.x - solarSun.x, f.y - solarSun.y);
                if (dist < dynamicRadius + 60) {
                    const heal = Math.floor(40 * currentFactor.heal);
                    f.hp = Math.min(f.maxHp, f.hp + Math.max(5, heal));
                    f.sunBonus += 1;
                }
            });
        }

        function drawSolarSun() {
            ctx.save();
            const r = solarSun.radius + Math.sin(solarSun.pulse) * 8;

            // Ogromni solarni zraci
            const sunGlow = ctx.createRadialGradient(solarSun.x, solarSun.y, 10, solarSun.x, solarSun.y, r + 80);
            sunGlow.addColorStop(0, 'rgba(255, 230, 100, 1)');
            sunGlow.addColorStop(0.3, 'rgba(255, 140, 0, 0.6)');
            sunGlow.addColorStop(0.7, 'rgba(255, 50, 0, 0.2)');
            sunGlow.addColorStop(1, 'transparent');

            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(solarSun.x, solarSun.y, r + 80, 0, Math.PI * 2);
            ctx.fill();

            // Središte Sunca
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(solarSun.x, solarSun.y, r * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Monstrumi sa JPG sličicama
        class Monster {
            constructor() { this.reset(); }
            reset() {
                const rect = canvas.parentElement.getBoundingClientRect();
                this.x = rect.width / 2 + (Math.random() - 0.5) * 40;
                this.y = rect.height / 2 + (Math.random() - 0.5) * 40;
                this.speed = Math.random() * 1.8 + 0.8;
                this.pickTarget();
            }
            pickTarget() {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length > 0) this.target = alive[Math.floor(Math.random() * alive.length)];
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.pickTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 16) {
                        const dmg = Math.floor((Math.random() * 500 + 100) * currentFactor.dmg);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        logMessage(`[NAPAD ZVERI] Monstrum pogodio ${this.target.name} (-${dmg} HP)`);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.drawImage(monsterImg, this.x - 12, this.y - 12, 24, 24);
            }
        }

        const monsters = Array.from({ length: 10 }, () => new Monster());

        // Haotični Neizvesni Napadi Frakcija
        let beams = [];
        function runWarEngine() {
            if (Math.random() < 0.12 * currentFactor.chaos) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;

                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    // Mogućnost kritičnog preokreta (Nepredvidivost)
                    const isCrit = Math.random() < 0.2;
                    const dmg = Math.floor((Math.random() * 800 + 200) * (isCrit ? 2.5 : 1.0));
                    tgt.hp = Math.max(0, tgt.hp - dmg);

                    beams.push({ sx: src.x, sy: src.y, tx: tgt.x, ty: tgt.y, color: src.color, alpha: 1 });
                    if (isCrit) logMessage(`[KRITIČAN PREOKRET] ${src.name} razara ${tgt.name} (-${dmg} HP)`);
                }
            }
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 8) consoleLog.removeChild(consoleLog.lastChild);
        }

        function drawBases() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.translate(f.x, f.y);

                // Zgrada
                ctx.shadowBlur = 12;
                ctx.shadowColor = f.color;
                ctx.fillStyle = '#061a0c';
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -18);
                ctx.restore();
            });
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';
            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `<span><b>${rank + 1}</b> ${f.name}</span><span style="color:${f.color}">${Math.floor(f.hp)}</span>`;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-hp').innerText = `${Math.floor(selectedFaction.hp)}`;
                document.getElementById('stat-sun').innerText = `+${selectedFaction.sunBonus} HP`;
                document.getElementById('stat-meta').innerText = selectedFaction.meta;
            }
        }

        function loop() {
            const rect = canvas.parentElement.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // Pozadina Džungle
            ctx.fillStyle = '#020b05';
            ctx.fillRect(0, 0, rect.width, rect.height);

            updateSolarSun();
            drawSolarSun();
            runWarEngine();

            // Laseri
            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
                ctx.restore();
                b.alpha -= 0.05;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            // Monstrumi
            monsters.forEach(m => { m.update(); m.draw(); });

            drawBases();
            updateUI();
            requestAnimationFrame(loop);
        }

        // Rotacija Spoljašnjih Faktora
        setInterval(() => {
            currentFactor = factors[Math.floor(Math.random() * factors.length)];
            factorDisplay.innerText = `FAKTOR: ${currentFactor.name}`;
            logMessage(`[SPOLJAŠNJI EVENT] ${currentFactor.name} je aktiviran!`);
        }, 4000);

        // Tajmer
        let totalSeconds = 0;
        setInterval(() => {
            totalSeconds++;
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);

        loop();
    </script>
</body>
</html>
