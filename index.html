<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3-DIMENSIONS MULTIVERSE WAR (1920x1080 60FPS)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000103;
            color: #00ffcc;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 200px;
            background: rgba(1, 5, 12, 0.95);
            border-right: 1px solid #00ffcc33;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-title {
            font-size: 10px;
            font-weight: bold;
            padding: 8px;
            border-bottom: 1px solid #00ffcc33;
            text-align: center;
            background: rgba(0, 255, 204, 0.05);
            letter-spacing: 1px;
        }
        #leaderboard {
            list-style: none;
            padding: 4px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .faction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 6px;
            margin-bottom: 2px;
            background: rgba(0, 255, 204, 0.02);
            border-left: 3px solid transparent;
            font-size: 8.5px;
            cursor: pointer;
        }
        #main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #top-bar {
            height: 35px;
            background: rgba(1, 5, 12, 0.95);
            border-bottom: 1px solid #00ffcc33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 10px;
            z-index: 5;
        }
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #bottom-bar {
            height: 80px;
            background: rgba(1, 5, 12, 0.95);
            border-top: 1px solid #00ffcc33;
            display: flex;
            padding: 4px;
            gap: 6px;
            font-size: 9px;
            z-index: 5;
        }
        #console-log {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            color: #00ffcc;
        }
        #stats-panel {
            width: 170px;
            border-left: 1px dashed #00ffcc33;
            padding-left: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="sidebar">
            <div class="sidebar-title">RANG LISTA (19 FRAKCIJA)</div>
            <ul id="leaderboard"></ul>
        </div>

        <div id="main-area">
            <div id="top-bar">
                <div id="boss-status" style="color:#ff0055; font-weight:bold;">3-DIM TITANI: CEKANJE</div>
                <div id="factor-display" style="color: #00ffff; font-weight: bold;">FAKTOR: Inicijalizacija...</div>
                <div id="timer-display" style="color: #00ffcc;">06:30</div>
            </div>

            <div id="canvas-wrapper">
                <canvas id="warCanvas"></canvas>
            </div>

            <div id="bottom-bar">
                <div id="console-log"></div>
                <div id="stats-panel">
                    <div style="font-weight:bold; color:#fff;" id="stat-name">Baza</div>
                    <div>Dimenzija: <span id="stat-dim">1</span></div>
                    <div>HP: <span id="stat-hp">500000</span></div>
                    <div>Solarni Efekat: <span id="stat-sun">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warCanvas');
        const ctx = canvas.getContext('2d');
        const leaderboard = document.getElementById('leaderboard');
        const consoleLog = document.getElementById('console-log');
        const timerDisplay = document.getElementById('timer-display');
        const factorDisplay = document.getElementById('factor-display');

        // Target Rezolucija 1920x1080 pri 60 FPS
        const V_WIDTH = 1920;
        const V_HEIGHT = 1080;

        function fitCanvas() {
            canvas.width = V_WIDTH;
            canvas.height = V_HEIGHT;
        }
        fitCanvas();

        const droneImg = new Image();
        droneImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="16,0 32,16 16,32 0,16" fill="%2300ffcc" opacity="0.4"/><polygon points="16,4 28,16 16,28 4,16" fill="%23000510" stroke="%2300ffcc" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="%23ff0055"/></svg>';

        const STARTING_HP = 500000;

        // UKUPNO 19 FRAKCIJA U 3 DIMENZIJE
        const factions = [
            // Dimenzija 1 (10 Frakcija)
            { id: 0, dim: 1, name: 'D1-ARES', color: '#ff3344', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 1, dim: 1, name: 'D1-ORION', color: '#00ccff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 2, dim: 1, name: 'D1-ZEPHYR', color: '#00ff66', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 3, dim: 1, name: 'D1-NEXUS', color: '#cc33ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 4, dim: 1, name: 'D1-SOLARIS', color: '#ffcc00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 5, dim: 1, name: 'D1-VORTEX', color: '#00ffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 6, dim: 1, name: 'D1-ECLIPSE', color: '#ff6633', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 7, dim: 1, name: 'D1-PHOENIX', color: '#ff3399', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 8, dim: 1, name: 'D1-TITAN', color: '#ffffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 9, dim: 1, name: 'D1-NOVA', color: '#00ffaa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },

            // Dimenzija 2 (6 Frakcija)
            { id: 10, dim: 2, name: 'D2-KRONOS', color: '#ff00aa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 11, dim: 2, name: 'D2-HYPERION', color: '#aaff00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 12, dim: 2, name: 'D2-CYBERUS', color: '#00aaff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 13, dim: 2, name: 'D2-VALKYRIE', color: '#ffaa00', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 14, dim: 2, name: 'D2-SPECTRA', color: '#aa00ff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 15, dim: 2, name: 'D2-OMEGA', color: '#00ffaa', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },

            // Dimenzija 3 (3 Frakcije)
            { id: 16, dim: 3, name: 'D3-CELESTIAL', color: '#ffffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 17, dim: 3, name: 'D3-VOIDKING', color: '#ff0055', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 },
            { id: 18, dim: 3, name: 'D3-ABYSS', color: '#00ffff', hp: STARTING_HP, maxHp: STARTING_HP, x: 0, y: 0, sunBonus: 0 }
        ];

        function initPositions() {
            const cx = V_WIDTH / 2;
            const cy = V_HEIGHT / 2;

            // D1 Pos (Unutrašnji krug)
            const d1 = factions.filter(f => f.dim === 1);
            d1.forEach((f, i) => {
                const a = (i / d1.length) * Math.PI * 2;
                f.x = cx + Math.cos(a) * 220;
                f.y = cy + Math.sin(a) * 220;
            });

            // D2 Pos (Srednji krug)
            const d2 = factions.filter(f => f.dim === 2);
            d2.forEach((f, i) => {
                const a = (i / d2.length) * Math.PI * 2;
                f.x = cx + Math.cos(a) * 380;
                f.y = cy + Math.sin(a) * 380;
            });

            // D3 Pos (Spoljašnji krug)
            const d3 = factions.filter(f => f.dim === 3);
            d3.forEach((f, i) => {
                const a = (i / d3.length) * Math.PI * 2;
                f.x = cx + Math.cos(a) * 510;
                f.y = cy + Math.sin(a) * 510;
            });
        }
        initPositions();

        // 3 Sunca za 3 Dimenzije
        const suns = [
            { dim: 1, x: 0, y: 0, r: 220, angle: 0, radius: 45, color: '#00ffff' },
            { dim: 2, x: 0, y: 0, r: 380, angle: Math.PI / 3, radius: 55, color: '#ff00aa' },
            { dim: 3, x: 0, y: 0, r: 510, angle: Math.PI / 1.5, radius: 65, color: '#ffffff' }
        ];

        function updateSuns() {
            const cx = V_WIDTH / 2;
            const cy = V_HEIGHT / 2;
            suns.forEach(s => {
                s.angle += 0.008 * (4 - s.dim);
                s.x = cx + Math.cos(s.angle) * s.r;
                s.y = cy + Math.sin(s.angle * 0.8) * s.r;

                factions.filter(f => f.dim === s.dim && f.hp > 0).forEach(f => {
                    const dist = Math.hypot(f.x - s.x, f.y - s.y);
                    if (dist < s.radius + 60) {
                        const heal = Math.floor(Math.random() * 90 + 30);
                        f.hp = Math.min(f.maxHp, f.hp + heal);
                        f.sunBonus += heal;
                    }
                });
            });
        }

        function drawSuns() {
            suns.forEach(s => {
                ctx.save();
                const glow = ctx.createRadialGradient(s.x, s.y, 5, s.x, s.y, s.radius + 70);
                glow.addColorStop(0, '#ffffff');
                glow.addColorStop(0.3, s.color);
                glow.addColorStop(1, 'transparent');

                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius + 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Monstrumi/Dronovi za sve 3 dimenzije (Slow Speed, -25% Dmg)
        class MultiDimDrone {
            constructor(dim) {
                this.dim = dim;
                this.reset();
            }
            reset() {
                const cx = V_WIDTH / 2;
                const cy = V_HEIGHT / 2;
                this.x = cx + (Math.random() - 0.5) * 100;
                this.y = cy + (Math.random() - 0.5) * 100;
                this.speed = Math.random() * 0.9 + 0.5;
                this.pickTarget();
            }
            pickTarget() {
                const alive = factions.filter(f => f.dim === this.dim && f.hp > 0);
                if (alive.length > 0) this.target = alive[Math.floor(Math.random() * alive.length)];
            }
            update() {
                if (!this.target || this.target.hp <= 0) this.pickTarget();
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;

                    if (dist < 18) {
                        const dmg = Math.floor((Math.random() * 450 + 150) * 0.75);
                        this.target.hp = Math.max(0, this.target.hp - dmg);
                        this.reset();
                    }
                }
            }
            draw() {
                ctx.drawImage(droneImg, this.x - 10, this.y - 10, 20, 20);
            }
        }

        const drones = [
            ...Array.from({ length: 8 }, () => new MultiDimDrone(1)),
            ...Array.from({ length: 6 }, () => new MultiDimDrone(2)),
            ...Array.from({ length: 4 }, () => new MultiDimDrone(3))
        ];

        // Boss Titani u 3 Dimenzije (na svakih 60 sec)
        const bosses = [
            { dim: 1, active: false, x: 0, y: 0, hp: 600000, maxHp: 600000, color: '#ff0055' },
            { dim: 2, active: false, x: 0, y: 0, hp: 600000, maxHp: 600000, color: '#ffaa00' },
            { dim: 3, active: false, x: 0, y: 0, hp: 600000, maxHp: 600000, color: '#ffffff' }
        ];

        function spawnBosses() {
            const cx = V_WIDTH / 2;
            const cy = V_HEIGHT / 2;
            bosses.forEach((b, idx) => {
                b.x = cx + Math.cos((idx / 3) * Math.PI * 2) * (idx * 150);
                b.y = cy + Math.sin((idx / 3) * Math.PI * 2) * (idx * 150);
                b.hp = 600000;
                b.active = true;
            });
            logMessage('[MULTIVERSE RUPTURA] Boss Titani su napali sve 3 dimenzije!');
        }

        function updateBosses() {
            bosses.forEach(b => {
                if (!b.active) return;
                const alive = factions.filter(f => f.dim === b.dim && f.hp > 0);
                alive.forEach(f => {
                    if (Math.random() < 0.3) {
                        const dmg = Math.floor(Math.random() * 1000 + 400);
                        f.hp = Math.max(0, f.hp - dmg);
                        beams.push({ sx: b.x, sy: b.y, tx: f.x, ty: f.y, color: b.color, alpha: 1, width: 2 });
                    }
                    if (Math.random() < 0.2) {
                        const cDmg = Math.floor(Math.random() * 2000 + 500);
                        b.hp -= cDmg;
                        beams.push({ sx: f.x, sy: f.y, tx: b.x, ty: b.y, color: f.color, alpha: 1, width: 2 });
                    }
                });
                if (b.hp <= 0) b.active = false;
            });
        }

        function drawBosses() {
            bosses.forEach(b => {
                if (!b.active) return;
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.shadowBlur = 20;
                ctx.shadowColor = b.color;
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(-20, -20, 40, 40);
                ctx.fillStyle = '#fff';
                ctx.fillRect(-6, -6, 12, 12);
                ctx.restore();
            });
        }

        let beams = [];
        function runWarEngine() {
            if (Math.random() < 0.3) {
                const alive = factions.filter(f => f.hp > 0);
                if (alive.length < 2) return;
                const src = alive[Math.floor(Math.random() * alive.length)];
                const tgt = alive[Math.floor(Math.random() * alive.length)];

                if (src.id !== tgt.id) {
                    const dmg = Math.floor(Math.random() * 1600 + 400);
                    tgt.hp = Math.max(0, tgt.hp - dmg);
                    beams.push({ sx: src.x, sy: src.y, tx: tgt.x, ty: tgt.y, color: src.color, alpha: 1, width: 2 });
                }
            }
        }

        function drawEnvironment() {
            const cx = V_WIDTH / 2;
            const cy = V_HEIGHT / 2;

            ctx.fillStyle = '#000206';
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // 3 Dimenzionalna Prstena na Mapi (+350% Prostora)
            const rings = [220, 380, 510];
            rings.forEach((r, idx) => {
                ctx.save();
                ctx.strokeStyle = `rgba(0, 255, 204, ${0.15 - idx * 0.03})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawBases() {
            factions.forEach(f => {
                if (f.hp <= 0) return;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = f.color;
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = f.color;

                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(-10, 6);
                ctx.lineTo(10, 6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.globalAlpha = 1.0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(f.name, 0, -18);
                ctx.restore();
            });
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerText = `[${time}] ${msg}`;
            consoleLog.prepend(div);
            if (consoleLog.children.length > 8) consoleLog.removeChild(consoleLog.lastChild);
        }

        let selectedFaction = factions[0];
        function updateUI() {
            const sorted = [...factions].sort((a, b) => b.hp - a.hp);
            leaderboard.innerHTML = '';
            sorted.forEach((f, rank) => {
                const li = document.createElement('li');
                li.className = 'faction-row';
                li.style.borderLeftColor = f.color;
                li.onclick = () => selectedFaction = f;
                li.innerHTML = `<span><b>${rank + 1}</b> ${f.name}</span><span style="color:${f.color}">${Math.floor(f.hp)}</span>`;
                leaderboard.appendChild(li);
            });

            if (selectedFaction) {
                document.getElementById('stat-name').innerText = selectedFaction.name;
                document.getElementById('stat-name').style.color = selectedFaction.color;
                document.getElementById('stat-dim').innerText = selectedFaction.dim;
                document.getElementById('stat-hp').innerText = `${Math.floor(selectedFaction.hp)}`;
                document.getElementById('stat-sun').innerText = `+${Math.floor(selectedFaction.sunBonus)} HP`;
            }
        }

        function loop() {
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            drawEnvironment();
            updateSuns();
            drawSuns();
            updateBosses();
            drawBosses();
            runWarEngine();

            beams.forEach((b, i) => {
                ctx.save();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = b.width;
                ctx.globalAlpha = b.alpha;
                ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
                ctx.restore();
                b.alpha -= 0.05;
                if (b.alpha <= 0) beams.splice(i, 1);
            });

            drones.forEach(d => { d.update(); d.draw(); });
            drawBases();
            updateUI();
            requestAnimationFrame(loop);
        }

        // Tajmer (06:30) & Boss Spawning na svakih 60 sec
        let matchTime = 390;
        const timerInterval = setInterval(() => {
            matchTime--;
            const m = String(Math.floor(matchTime / 60)).padStart(2, '0');
            const s = String(matchTime % 60).padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;

            if (matchTime % 60 === 0 && matchTime > 0) {
                spawnBosses();
            }

            if (matchTime <= 0) {
                clearInterval(timerInterval);
                logMessage('[KRAJ SIMULACIJE] Vreme je isteklo! 3D Multiverse pobednik proglašen.');
            }
        }, 1000);

        loop();
    </script>
</body>
</html>
