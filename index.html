/* =========================================================

   ========================================================= */

:root {
    --ui-bg: rgba(8, 12, 18, 0.92);
    --ui-bg-soft: rgba(15, 22, 32, 0.88);
    --ui-border: rgba(255, 255, 255, 0.12);
    --ui-text: #f4f7fb;
    --ui-muted: #9da8b8;
    --accent: #69d2ff;
    --danger: #ff6262;
    --success: #66e39a;
    --gold: #ffd166;
    --energy: #7dd3fc;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #070b10;
    color: var(--ui-text);
    font-family:

        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",

}

body {
    touch-action: none;
    user-select: none;
}

button {
    border: 0;
    color: var(--ui-text);
    background: none;
    font: inherit;
    cursor: pointer;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0b1118;
}

/* =========================================================
   TOP HUD
   ========================================================= */

#topHUD {
    position: fixed;
    z-index: 10;
    left: 0;
    right: 0;
    top: 0;
    min-height: 62px;
    padding:
        calc(8px + env(safe-area-inset-top))
        10px
        8px
        10px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    pointer-events: none;
}

.hudPanel {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px;
    border: 1px solid var(--ui-border);
    background: var(--ui-bg);
    border-radius: 13px;
    backdrop-filter: blur(5px);
}

.resource {
    min-width: 54px;
    padding: 5px 7px;
    border-radius: 8px;
    background: rgba(255,255,255,0.045);
    text-align: center;
}

.resourceIcon {
    display: block;
    font-size: 14px;
    line-height: 14px;
}

.resourceValue {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 800;
}

/* =========================================================
   FPS / MAP LABEL
   ========================================================= */

#debugHUD {

    pointer-events: none;
}

#mapName {

}

/* =========================================================

}

.actionGroup {

    gap: 6px;

}

.actionButton {

.actionButton.active {

}

.actionButton.danger {

}

}

/* =========================================================
   SELECTION PANEL
   ========================================================= */

#selectionPanel {

/* =========================================================

   ========================================================= */

.modal {

    justify-content: center;

.cardGrid,

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function lerp(a, b, t) {

    return a + (b - a) * t;

}


function dist(ax, ay, bx, by) {

    const dx = bx - ax;
    const dy = by - ay;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


function distanceSquared(ax, ay, bx, by) {

    const dx = bx - ax;
    const dy = by - ay;

    return dx * dx + dy * dy;

}


function randInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function hash2D(x, y, seed) {

    let h =
        Math.imul(
            x ^ seed,
            374761393
        );

    h =
        Math.imul(
            h ^ (y * 668265263),
            1274126177
        );

    h ^=
        h >>> 13;

    h =
        Math.imul(
            h,
            2246822519
        );

    h ^=
        h >>> 16;

    return (
        h >>> 0
    ) / 4294967295;

}


function smoothNoise(x, y, seed) {

    const x0 = Math.floor(x);
    const y0 = Math.floor(y);

    const x1 = x0 + 1;
    const y1 = y0 + 1;

    const sx = x - x0;
    const sy = y - y0;

    const a =
        hash2D(x0, y0, seed);

    const b =
        hash2D(x1, y0, seed);

    const c =
        hash2D(x0, y1, seed);

    const d =
        hash2D(x1, y1, seed);

    const ux =
        sx * sx *
        (3 - 2 * sx);

    const uy =
        sy * sy *
        (3 - 2 * sy);

    return lerp(
        lerp(a, b, ux),
        lerp(c, d, ux),
        uy
    );

}


function fractalNoise(x, y, seed) {

    let value = 0;
    let amplitude = 0.5;
    let frequency = 1;

    for (let i = 0; i < 4; i++) {

        value +=
            smoothNoise(
                x * frequency,
                y * frequency,
                seed + i * 17
            ) * amplitude;

        frequency *= 2;
        amplitude *= 0.5;

    }

    return value;

}


function chooseWeighted(entries) {

    let total = 0;

    for (const item of entries) {
        total += item.weight;
    }

    let roll =
        Math.random() * total;

    for (const item of entries) {

        roll -= item.weight;

        if (roll <= 0) {
            return item.value;
        }

    }

    return entries[
        entries.length - 1
    ].value;

}

const camera = {

    x: 0,

    y: 0,

    zoom: CONFIG.START_ZOOM,

    targetX: 0,

    targetY: 0,

    targetZoom: CONFIG.START_ZOOM,

    shake: 0

};


function worldWidth() {

    return (
        CONFIG.WORLD_COLS *
        CONFIG.TILE_SIZE
    );

}


function worldHeight() {

    return (
        CONFIG.WORLD_ROWS *
        CONFIG.TILE_SIZE
    );

}


function screenToWorld(
    sx,
    sy
) {

    return {

        x:
            camera.x +
            (
                sx -
                screenWidth / 2
            ) /
            camera.zoom,

        y:
            camera.y +
            (
                sy -
                screenHeight / 2
            ) /
            camera.zoom

    };

}


function worldToScreen(
    wx,
    wy
) {

    return {

        x:
            (
                wx -
                camera.x
            ) *
            camera.zoom +
            screenWidth / 2,

        y:
            (
                wy -
                camera.y
            ) *
            camera.zoom +
            screenHeight / 2

    };

}


function clampCamera() {

    const halfW =
        screenWidth /
        camera.zoom /
        2;

    const halfH =
        screenHeight /
        camera.zoom /
        2;

    camera.targetX =
        clamp(
            camera.targetX,
            halfW,
            worldWidth() - halfW
        );

    camera.targetY =
        clamp(
            camera.targetY,
            halfH,
            worldHeight() - halfH
        );

}


function updateCamera(dt) {

    clampCamera();

    camera.x =
        lerp(
            camera.x,
            camera.targetX,
            Math.min(
                1,
                dt * 8
            )
        );

    camera.y =
        lerp(
            camera.y,
            camera.targetY,
            Math.min(
                1,
                dt * 8
            )
        );

    camera.zoom =
        lerp(
            camera.zoom,
            camera.targetZoom,
            Math.min(
                1,
                dt * 9
            )
        );

    if (camera.shake > 0) {
        camera.shake =
            Math.max(
                0,
                camera.shake -
                dt
            );
    }

}


/* =========================================================
   07. MAP GENERATION
   ========================================================= */

function createTile(
    col,
    row,
    terrain
) {

    return {

        col,

        row,

        x:
            col *
            CONFIG.TILE_SIZE,

        y:
            row *
            CONFIG.TILE_SIZE,

        terrain,

        owner: null,

        resource: null,

        jungle: null,

        discovered: true,

        blocked: false

    };

}


function generateMap() {

    game.tiles = [];

    game.resourceNodes = [];

    game.obstacles = [];

    const seed =
        game.seed;

    for (
        let row = 0;
        row < CONFIG.WORLD_ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < CONFIG.WORLD_COLS;
            col++
        ) {

            const n =
                fractalNoise(
                    col / 10,
                    row / 10,
                    seed
                );

            const detail =
                fractalNoise(
                    col / 4,
                    row / 4,
                    seed + 77
                );

            let terrain =
                TERRAIN.PLAIN;

            if (n < 0.23) {

                terrain =
                    TERRAIN.WATER;

            }
            else if (n > 0.82) {

                terrain =
                    TERRAIN.MOUNTAIN;

            }
            else if (detail > 0.68) {

                terrain =
                    TERRAIN.JUNGLE;

            }
            else if (detail > 0.53) {

                terrain =
                    TERRAIN.FOREST;

            }
            else if (
                detail < 0.14 &&
                n > 0.35
            ) {

                terrain =
                    TERRAIN.RUINS;

            }

            const tile =
                createTile(
                    col,
                    row,
                    terrain
                );

            if (
                terrain === TERRAIN.JUNGLE &&
                hash2D(
                    col,
                    row,
                    seed + 400
                ) > 0.68
            ) {

                tile.jungle =
                    chooseWeighted([

                        {
                            value:
                                JUNGLE_OBJECTS.treeCluster,
                            weight: 65
                        },

                        {
                            value:
                                JUNGLE_OBJECTS.ancientGrove,
                            weight: 20
                        },

                        {
                            value:
                                JUNGLE_OBJECTS.hiddenCamp,
                            weight: 15
                        }

                    ]);

            }

            game.tiles.push(tile);

        }

    }

    createResourceNodes();

    repairBaseAreas();

}


function tileAt(
    col,
    row
) {

    if (
        col < 0 ||
        row < 0 ||
        col >= CONFIG.WORLD_COLS ||
        row >= CONFIG.WORLD_ROWS
    ) {

        return null;

    }

    return game.tiles[
        row *
        CONFIG.WORLD_COLS +
        col
    ];

}


function worldToTile(
    x,
    y
) {

    const col =
        Math.floor(
            x /
            CONFIG.TILE_SIZE
        );

    const row =
        Math.floor(
            y /
            CONFIG.TILE_SIZE
        );

    return tileAt(
        col,
        row
    );

}


function repairBaseAreas() {

    const spots = [

        {
            col: 6,
            row: 6
        },

        {
            col:
                CONFIG.WORLD_COLS - 7,
            row: 6
        },

        {
            col: 6,
            row:
                CONFIG.WORLD_ROWS - 7
        },

        {
            col:
                CONFIG.WORLD_COLS - 7,
            row:
                CONFIG.WORLD_ROWS - 7
        }

    ];

    for (const spot of spots) {

        for (
            let y = -3;
            y <= 3;
            y++
        ) {

            for (
                let x = -3;
                x <= 3;
                x++
            ) {

                const tile =
                    tileAt(
                        spot.col + x,
                        spot.row + y
                    );

                if (!tile) {
                    continue;
                }

                if (
                    tile.terrain ===
                    TERRAIN.WATER ||
                    tile.terrain ===
                    TERRAIN.MOUNTAIN
                ) {

                    tile.terrain =
                        TERRAIN.PLAIN;

                    tile.jungle =
                        null;

                }

            }

        }

    }

}


function createResourceNodes() {

    const types = [

        "gold",
        "wood",
        "metal",
        "energy"

    ];

    for (
        let i = 0;
        i < 65;
        i++
    ) {

        const col =
            randInt(
                2,
                CONFIG.WORLD_COLS - 3
            );

        const row =
            randInt(
                2,
                CONFIG.WORLD_ROWS - 3
            );

        const tile =
            tileAt(
                col,
                row
            );

        if (
            !tile ||
            !tile.terrain.passable ||
            tile.resource
        ) {

            continue;

        }

        const type =
            types[
                randInt(
                    0,
                    types.length - 1
                )
            ];

        tile.resource = {

            type,

            amount:
                randInt(150, 450),

            rate:
                RESOURCE_TYPES[
                    type
                ].baseValue

        };

        game.resourceNodes.push(
            tile
        );

    }

}

/* =========================================================
   09. UNIT SYSTEM
   ========================================================= */

let nextUnitId = 1;


class Unit {

    constructor(
        faction,
        type,
        x,
        y,
        isPlayer = false
    ) {

        const data =
            UNIT_TYPES[type];

        const factionData =
            FACTIONS[faction];

        this.id =
            nextUnitId++;

        this.faction =
            faction;

        this.type =
            type;

        this.name =
            data.name;

        this.x = x;

        this.y = y;

        this.targetX = x;

        this.targetY = y;

        this.path = [];

        this.pathIndex = 0;

        this.isPlayer =
            isPlayer;

        this.maxHp =
            data.hp;

        this.hp =
            data.hp;

        this.attack =
            data.attack;

        this.defense =
            data.defense;

        this.speed =
            data.speed *
            (
                1 +
                (
                    factionData.bonuses.movement ||
                    0
                )
            );

        this.range =
            data.range +
            (
                factionData.bonuses.range ||
                0
            );

        this.vision =
            data.vision;

        this.capacity =
            data.capacity;

        this.cooldown = 0;

        this.selected = false;

        this.items = [];

        this.buffs = {

            attack: 0,

            defense: 0,

            speed: 0,

            slow: 0,

            damageMultiplier: 0,

            energyRegen: 0

        };

        this.order = "idle";

        this.alive = true;

        this.lastHitTime = 0;

        this.resourceCarry = {

            gold: 0,

            wood: 0,

            metal: 0,

            energy: 0

        };

    }


    get effectiveAttack() {

        return (
            this.attack +
            this.buffs.attack
        ) *
        (
            1 +
            this.buffs.damageMultiplier
        );

    }


    get effectiveDefense() {

        return (
            this.defense +
            this.buffs.defense
        );

    }


    get effectiveSpeed() {

        return (
            this.speed +
            this.buffs.speed
        ) *
        (
            1 -
            clamp(
                this.buffs.slow,
                0,
                0.8
            )
        );

    }


    moveTo(
        x,
        y
    ) {

        this.targetX =
            clamp(
                x,
                0,
                worldWidth()
            );

        this.targetY =
            clamp(
                y,
                0,
                worldHeight()
            );

        this.order =
            "move";

        this.path =
            findPath(
                this.x,
                this.y,
                this.targetX,
                this.targetY
            );

        this.pathIndex = 0;

    }


    stop() {

        this.order =
            "idle";

        this.path = [];

    }


    update(dt) {

        if (!this.alive) {
            return;
        }

        this.cooldown =
            Math.max(
                0,
                this.cooldown - dt
            );

        this.buffs.slow =
            Math.max(
                0,
                this.buffs.slow - dt * 0.05
            );

        this.buffs.attack =
            Math.max(
                0,
                this.buffs.attack - dt * 2
            );

        this.buffs.defense =
            Math.max(
                0,
                this.buffs.defense - dt * 2
            );

        this.buffs.speed =
            Math.max(
                0,
                this.buffs.speed - dt * 0.5
            );

        if (
            this.order === "move"
        ) {

            this.updateMovement(
                dt
            );

        }

    }


    updateMovement(dt) {

        if (
            this.path.length === 0 ||
            this.pathIndex >=
            this.path.length
        ) {

            const distanceToTarget =
                dist(
                    this.x,
                    this.y,
                    this.targetX,
                    this.targetY
                );

            if (
                distanceToTarget > 5
            ) {

                this.moveDirectly(
                    dt
                );

            }
            else {

                this.stop();

            }

            return;

        }

        const node =
            this.path[
                this.pathIndex
            ];

        const targetX =
            node.x;

        const targetY =
            node.y;

        const d =
            dist(
                this.x,
                this.y,
                targetX,
                targetY
            );

        if (d < 5) {

            this.pathIndex++;

            return;

        }

        const speed =
            this.effectiveSpeed *
            25;

        this.x +=
            (
                targetX -
                this.x
            ) /
            d *
            speed *
            dt;

        this.y +=
            (
                targetY -
                this.y
            ) /
            d *
            speed *
            dt;

    }


    moveDirectly(dt) {

        const d =
            dist(
                this.x,
                this.y,
                this.targetX,
                this.targetY
            );

        if (d < 3) {

            this.stop();

            return;

        }

        const speed =
            this.effectiveSpeed *
            25;

        this.x +=
            (
                this.targetX -
                this.x
            ) /
            d *
            speed *
            dt;

        this.y +=
            (
                this.targetY -
                this.y
            ) /
            d *
            speed *
            dt;

    }


    attackUnit(target) {

        if (
            !target ||
            !target.alive ||
            target.faction ===
            this.faction
        ) {

            return false;

        }

        if (
            this.cooldown > 0
        ) {

            return false;

        }

        const d =
            dist(
                this.x,
                this.y,
                target.x,
                target.y
            );

        if (
            d > this.range
        ) {

            return false;

        }

        let terrainDefense = 0;

        const tile =
            worldToTile(
                target.x,
                target.y
            );

        if (tile) {

            terrainDefense =
                tile.terrain.defense;

            if (tile.jungle) {

                terrainDefense +=
                    tile.jungle.defenseBonus;

            }

        }

        const damage =
            Math.max(
                1,
                Math.round(
                    this.effectiveAttack -
                    target.effectiveDefense * 0.55 -
                    terrainDefense * 0.35
                )
            );

        target.takeDamage(
            damage,
            this
        );

        this.cooldown =
            1.15;

        createHitEffect(
            target.x,
            target.y,
            damage
        );

        return true;

    }


    takeDamage(
        damage,
        attacker
    ) {

        if (!this.alive) {
            return;
        }

        this.hp =
            Math.max(
                0,
                this.hp -
                damage
            );

        this.lastHitTime =
            game.time;

        if (
            this.hp <= 0
        ) {

            this.die();

            if (
                attacker &&
                attacker.isPlayer
            ) {

                game.resources.gold +=
                    35;

            }

        }

    }


    die() {

        this.alive =
            false;

        this.hp = 0;

        createDeathEffect(
            this.x,
            this.y
        );

        if (
            game.selectedUnit ===
            this
        ) {

            game.selectedUnit =
                null;

            updateSelectionUI();

        }

    }


    addItem(
        itemId
    ) {

        const item =
            ITEMS[itemId];

        if (!item) {
            return false;
        }

        if (
            this.items.includes(
                itemId
            )
        ) {

            return false;

        }

        this.items.push(
            itemId
        );

        if (
            item.stats.attack
        ) {

            this.attack +=
                item.stats.attack;

        }

        if (
            item.stats.defense
        ) {

            this.defense +=
                item.stats.defense;

        }

        if (
            item.stats.speedMultiplier
        ) {

            this.speed *=
                1 +
                item.stats.speedMultiplier;

        }

        if (
            item.stats.energyRegen
        ) {

            this.buffs.energyRegen +=
                item.stats.energyRegen;

        }

        return true;

    }

}
