<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ELEMENTAL FRONTIER — TURN BASED LUDO</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#05080c; color:#d8e2e8; font-family:sans-serif; }
#game{ width:100vw; height:100vh; display:flex; flex-direction:column; }

/* TOP BAR */
#top{ height:45px; background:#0d131a; border-bottom:1px solid #1e2936; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:12px; }
#turnIndicator{ font-weight:bold; color:#ffca28; }

/* MAIN AREA */
#main{ flex:1; display:flex; position:relative; overflow:hidden; }

/* LEFT PANEL - FRAKCIJE */
#left{ width:180px; background:#0a0f14; border-right:1px solid #1e2936; overflow-y:auto; padding:8px; }
.faction-card{ padding:8px; margin-bottom:6px; background:#0f1720; border-left:4px solid; border-radius:3px; font-size:11px; cursor:pointer; }
.faction-card.active-turn{ background:#192938; box-shadow:0 0 8px rgba(255,255,255,0.2); }
.hp-bar{ height:5px; background:#18222d; margin-top:4px; border-radius:2px; overflow:hidden; }
.hp-bar i{ display:block; height:100%; }

/* MAP AREA */
#mapWrap{ flex:1; position:relative; background:#030508; display:flex; justify-content:center; align-items:center; }
#map{ width:100%; height:100%; display:block; }

/* RIGHT PANEL - SHOP & STATS */
#right{ width:280px; background:#0a0f14; border-left:1px solid #1e2936; display:flex; flex-direction:column; padding:10px; overflow-y:auto; }
.stat-box{ background:#111923; padding:8px; border-radius:4px; margin-bottom:10px; border:1px solid #1f2e3d; font-size:11px; }
.stat-row{ display:flex; justify-content:space-between; margin-bottom:3px; }

/* DICE & ACTION */
#diceBox{ text-align:center; background:#162330; padding:10px; border-radius:6px; border:1px solid #2d4156; margin-bottom:10px; }
#diceVal{ font-size:28px; font-weight:bold; color:#ffca28; margin:4px 0; }
.btn-roll{ width:100%; padding:10px; background:#ffca28; color:#000; font-weight:bold; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
.btn-roll:hover{ background:#ffd54f; }
.btn-roll:disabled{ background:#444; color:#888; cursor:not-allowed; }

/* SHOP */
.shop-title{ font-size:12px; font-weight:bold; margin-bottom:6px; color:#fff; }
.item-list{ display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; }
.item-card{ background:#121b24; border:1px solid #223242; padding:6px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.item-card:hover{ border-color:#3a5470; background:#182430; }
.item-title{ font-size:10px; font-weight:bold; color:#dce6f0; }
.item-stats{ font-size:8px; color:#7f93a8; display:block; }
.item-price{ font-size:11px; font-weight:bold; color:#ffca28; }

/* BOTTOM LOG */
#bottom{ height:60px; background:#080c10; border-top:1px solid #1e2936; padding:6px 12px; font-family:monospace; font-size:10px; color:#859bb0; overflow-y:auto; }

@media(max-width:768px){
  #left{ width:130px; }
  #right{ width:210px; }
}
</style>
</head>
<body>
<div id="game">
  <header id="top">
    <div><b>ELEMENTAL FRONTIER</b></div>
    <div id="turnIndicator">NA POTEZU: ARES</div>
    <div>RUNDA: <span id="roundNum">1</span></div>
  </header>

  <div id="main">
    <!-- FRAKCIJE -->
    <aside id="left">
      <div id="factionsList"></div>
    </aside>

    <!-- MAPA -->
    <main id="mapWrap">
      <canvas id="map"></canvas>
    </main>

    <!-- KOCKICA & ŠOP -->
    <aside id="right">
      <div id="diceBox">
        <div style="font-size:10px; color:#aaa;">POTEZNA KOCKICA</div>
        <div id="diceVal">-</div>
        <button id="rollBtn" class="btn-roll" onclick="playTurn()">BACI KOCKICU</button>
      </div>

      <div class="stat-box">
        <div class="stat-row"><span>Frakcija:</span><b id="stName">-</b></div>
        <div class="stat-row"><span>Zlato:</span><b id="stGold" style="color:#ffca28;">0 G</b></div>
        <div class="stat-row"><span>HP:</span><b id="stHP">0/0</b></div>
        <div class="stat-row"><span>ATK / DEF:</span><b id="stStats">0 / 0</b></div>
        <div class="stat-row"><span>SPD / HEAL:</span><b id="stExtra">0 / 0</b></div>
      </div>

      <div class="shop-title">ŠOP (50+ ITEMA)</div>
      <div id="shopList" class="item-list"></div>
    </aside>
  </div>

  <footer id="bottom" id="logBox">
    <div id="log"></div>
  </footer>
</div>

<script>
/* CANVAS SETUP */
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let W = 600, H = 600;

function resize(){
  const wrap = document.getElementById("mapWrap");
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBoardPath();
}
window.addEventListener("resize", resize);

/* BOARD PATH (ČOVEČE NE LJUTI SE STAZE) */
const boardNodes = [];
const TOTAL_NODES = 40;

function buildBoardPath(){
  boardNodes.length = 0;
  const pad = 40;
  const rw = W - pad * 2;
  const rh = H - pad * 2;
  for(let i=0; i<TOTAL_NODES; i++){
    let pct = i / TOTAL_NODES;
    let x, y;
    if(pct < 0.25){ x = pad + (pct / 0.25) * rw; y = pad; }
    else if(pct < 0.5){ x = pad + rw; y = pad + ((pct - 0.25) / 0.25) * rh; }
    else if(pct < 0.75){ x = pad + rw - ((pct - 0.5) / 0.25) * rw; y = pad + rh; }
    else { x = pad; y = pad + rh - ((pct - 0.75) / 0.25) * rh; }
    boardNodes.push({ x, y });
  }
}

/* 50 GENERISANIH ITEMA (250G - 5000G) */
const namePrefixes = ["Runic", "Void", "Shadow", "Celestial", "Infernal", "Glacial", "Arcane", "Titan's"];
const nameTypes = ["Blade", "Aegis", "Tome", "Crown", "Scepter", "Visage", "Heart", "Ring"];
const nameSuffixes = ["of Abyss", "of Ruin", "of Storms", "of Eternity", "of Might"];

function generate50Items(){
  const list = [];
  for(let i = 0; i < 50; i++){
    const ratio = i / 49;
    const price = Math.round((250 + ratio * 4750) / 10) * 10;
    const p = price / 250;
    
    const pFix = namePrefixes[i % namePrefixes.length];
    const tFix = nameTypes[i % nameTypes.length];
    const sFix = nameSuffixes[i % nameSuffixes.length];

    list.push({
      id: i + 1,
      name: `${pFix} ${tFix} ${sFix}`,
      price: price,
      hp: Math.floor((Math.random() * 60 + 30) * p),
      att: Math.floor((Math.random() * 10 + 5) * p),
      def: Math.floor((Math.random() * 8 + 3) * p),
      speed: parseFloat((Math.random() * 1.5 + 0.5 * (p * 0.3)).toFixed(1)),
      heal: Math.floor((Math.random() * 8 + 2) * p),
      manaRegen: parseFloat((Math.random() * 1 + 0.5 * p).toFixed(1))
    });
  }
  return list.sort((a,b) => a.price - b.price);
}
const shopItems = generate50Items();

/* FRAKCIJE */
const defs = [
  { name:"ARES", color:"#ff3b30", start:0 },
  { name:"TIDAL", color:"#2196f3", start:4 },
  { name:"TERRA", color:"#9c7a4a", start:8 },
  { name:"AERIS", color:"#b8e8ff", start:12 },
  { name:"CRYON", color:"#72e6ff", start:16 },
  { name:"VOLT", color:"#ffff33", start:20 },
  { name:"SYLVAN", color:"#50d66b", start:24 },
  { name:"VOID", color:"#b000ff", start:28 },
  { name:"SOLAR", color:"#ffd54f", start:32 },
  { name:"NEXUS", color:"#ff55cc", start:36 }
];

let factions = [];
let currentTurn = 0;
let roundCount = 1;
let consecutiveSixes = 0;

function initFactions(){
  factions = defs.map((d, i) => ({
    id: i,
    name: d.name,
    color: d.color,
    node: d.start,
    hp: 800, maxHp: 800,
    gold: 500, // Početni novac
    attack: 30, defense: 10,
    speed: 10, heal: 0, manaRegen: 1,
    alive: true
  }));
}

/* LOGIKA IGRE I POTEZA */
function playTurn(){
  const f = factions[currentTurn];
  if(!f || !f.alive){
    nextTurn();
    return;
  }

  const dice = Math.floor(Math.random() * 6) + 1;
  document.getElementById("diceVal").textContent = dice;

  // Pomeranje po poljima
  f.node = (f.node + dice) % TOTAL_NODES;

  // Zarada po potezu (skalira sa rundama)
  const scale = Math.pow(1.05, roundCount);
  const earned = Math.floor((120 + dice * 25) * scale);
  f.gold += earned;

  log(`${f.name} bacio [${dice}]. Stao na polje ${f.node}. Zaradio +${earned}G.`);

  // Napad: Samo frakcija koja baca kockicu napada ako stane na nekoga
  factions.forEach(target => {
    if(target.id !== f.id && target.alive && target.node === f.node){
      executeAttack(f, target);
    }
  });

  // Pravilo za dve šestice (igra se opet)
  if(dice === 6){
    consecutiveSixes++;
    if(consecutiveSixes === 2){
      log(`🔥 ${f.name} JE DOBIO DVE ŠESTICE ZAREDOM! Dobija dodatno bacanje!`);
      consecutiveSixes = 0;
      renderUI();
      return; // Ne prelazi na sledećeg
    }
  } else {
    consecutiveSixes = 0;
  }

  nextTurn();
}

function nextTurn(){
  do {
    currentTurn = (currentTurn + 1) % factions.length;
    if(currentTurn === 0) roundCount++;
  } while(!factions[currentTurn].alive);

  renderUI();
}

function executeAttack(attacker, defender){
  log(`⚔️ BOJ: ${attacker.name} napada ${defender.name} na polju ${attacker.node}!`);
  
  const dmg = Math.max(15, attacker.attack * 1.4 - defender.defense * 0.4);
  defender.hp -= dmg;

  if(defender.hp <= 0){
    defender.hp = 0;
    defender.alive = false;
    attacker.gold += defender.gold;
    log(`☠️ ${attacker.name} je ELIMINISAO ${defender.name} i uzeo sve njegove dukate!`);
  } else {
    log(`${defender.name} preživeo napad sa ${Math.floor(defender.hp)} HP.`);
  }
}

function buyItem(item){
  const f = factions[currentTurn];
  if(!f || !f.alive) return;
  if(f.gold < item.price){
    log(`❌ ${f.name} nema dovoljno zlata za ${item.name}!`);
    return;
  }

  f.gold -= item.price;
  f.maxHp += item.hp;
  f.hp += item.hp;
  f.attack += item.att;
  f.defense += item.def;
  f.speed += item.speed;
  f.heal += item.heal;
  f.manaRegen += item.manaRegen;

  log(`🛒 ${f.name} je kupio [${item.name}] za ${item.price}G!`);
  renderUI();
}

/* RENDER SVEGA */
function renderUI(){
  document.getElementById("roundNum").textContent = roundCount;
  const curF = factions[currentTurn];
  document.getElementById("turnIndicator").textContent = "NA POTEZU: " + curF.name;
  document.getElementById("turnIndicator").style.color = curF.color;

  // Lista frakcija
  const list = document.getElementById("factionsList");
  list.innerHTML = "";
  factions.forEach(f => {
    const d = document.createElement("div");
    d.className = "faction-card" + (f.id === currentTurn ? " active-turn" : "");
    d.style.borderColor = f.alive ? f.color : "#333";
    d.style.opacity = f.alive ? "1" : "0.3";
    d.innerHTML = `
      <b>${f.name}</b> <small style="float:right; color:#ffca28;">${Math.floor(f.gold)}G</small>
      <div class="hp-bar"><i style="width:${Math.max(0, (f.hp/f.maxHp)*100)}%; background:${f.color};"></i></div>
    `;
    list.appendChild(d);
  });

  // Statovi frakcije na potezu
  document.getElementById("stName").textContent = curF.name;
  document.getElementById("stGold").textContent = Math.floor(curF.gold) + " G";
  document.getElementById("stHP").textContent = Math.floor(curF.hp) + " / " + Math.floor(curF.maxHp);
  document.getElementById("stStats").textContent = Math.floor(curF.attack) + " / " + Math.floor(curF.defense);
  document.getElementById("stExtra").textContent = curF.speed.toFixed(1) + " / " + curF.heal;

  // Šop render
  const shopEl = document.getElementById("shopList");
  shopEl.innerHTML = "";
  shopItems.forEach(item => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
      <div>
        <div class="item-title">${item.name}</div>
        <span class="item-stats">HP:+${item.hp} ATK:+${item.att} DEF:+${item.def} SPD:+${item.speed}</span>
      </div>
      <div class="item-price">${item.price}G</div>
    `;
    card.onclick = () => buyItem(item);
    shopEl.appendChild(card);
  });
}

function log(msg){
  const b = document.getElementById("log");
  const d = document.createElement("div");
  d.textContent = msg;
  b.prepend(d);
}

function draw(){
  ctx.fillStyle = "#030508";
  ctx.fillRect(0,0,W,H);

  // Polja staze
  boardNodes.forEach((n, i) => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 7, 0, Math.PI*2);
    ctx.fillStyle = "#121d28";
    ctx.fill();
    ctx.strokeStyle = "#253748";
    ctx.stroke();
  });

  // Figurice
  factions.forEach(f => {
    if(!f.alive) return;
    const n = boardNodes[f.node];
    if(!n) return;

    ctx.beginPath();
    ctx.arc(n.x, n.y, 9, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.strokeStyle = f.id === currentTurn ? "#ffffff" : "#000000";
    ctx.lineWidth = f.id === currentTurn ? 3 : 1;
    ctx.stroke();
  });

  requestAnimationFrame(draw);
}

/* START */
resize();
initFactions();
renderUI();
log("Igra počinje! ARES je prvi na potezu.");
requestAnimationFrame(draw);
</script>
</body>
</html>
