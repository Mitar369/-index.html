<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Elemental Frontiers</title>
<style>
:root {
    --ui-bg: rgba(8, 12, 18, 0.92);
    --ui-border: rgba(255, 255, 255, 0.12);
    --ui-text: #f4f7fb;
    --ui-muted: #9da8b8;
    --accent: #69d2ff;
    --danger: #ff6262;
    --success: #66e39a;
    --gold: #ffd166;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #070b10; color: var(--ui-text); font-family: Inter, system-ui, sans-serif; }
body { touch-action: none; user-select: none; }
button { border: 0; color: var(--ui-text); background: none; font: inherit; cursor: pointer; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0a0e14; }
#topHUD { position: fixed; z-index: 10; left: 0; right: 0; top: 0; min-height: 62px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px 10px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.hudPanel { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 7px; border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 13px; backdrop-filter: blur(5px); }
.resource { min-width: 54px; padding: 5px 7px; border-radius: 8px; background: rgba(255,255,255,0.045); text-align: center; }
.resourceIcon { display: block; font-size: 14px; }
.resourceValue { display: block; margin-top: 2px; font-size: 12px; font-weight: 800; }
#debugHUD { position: fixed; z-index: 11; top: calc(72px + env(safe-area-inset-top)); right: 10px; padding: 5px 8px; border-radius: 8px; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.35); font-size: 10px; }
#bottomHUD { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding: 7px 8px calc(8px + env(safe-area-inset-bottom)) 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 7px; pointer-events: none; }
.actionGroup { display: flex; gap: 6px; pointer-events: auto; }
.actionButton { width: 57px; height: 57px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--ui-border); border-radius: 13px; background: var(--ui-bg); color: white; font-size: 10px; font-weight: 800; backdrop-filter: blur(5px); transition: all 0.1s; }
.actionButton:active { transform: scale(0.95); }
.actionButton.active { border-color: var(--accent); background: rgba(60,140,190,0.25); }
.bigIcon { font-size: 19px; line-height: 20px; margin-bottom: 2px; }
.modal { position: fixed; z-index: 50; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,0.57); }
.modal.open { display: flex; }
.modalBox { width: min(560px, 100%); max-height: min(720px, 88vh); overflow: auto; padding: 16px; border: 1px solid var(--ui-border); border-radius: 16px; background: #101720; }
.modalHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
.modalTitle { font-size: 19px; font-weight: 900; }
.closeButton { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.06); padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.selectionPanel { position: fixed; z-index: 18; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%); min-width: 210px; max-width: calc(100vw - 20px); padding: 10px 12px; border: 1px solid var(--ui-border); border-radius: 12px; background: var(--ui-bg); pointer-events: none; opacity: 0; transition: opacity 0.12s linear; }
.selectionPanel.visible { opacity: 1; }
@media (max-width: 500px) { .actionButton { width: 53px; height: 53px; } }
@media (min-width: 800px) { .actionButton { width: 66px; height: 60px; } .resource { min-width: 66px; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="topHUD">
    <div class="hudPanel">
        <div class="resource"><span class="resourceIcon">🪙</span><span id="goldValue">500</span></div>
        <div class="resource"><span class="resourceIcon">🌲</span><span id="woodValue">300</span></div>
        <div class="resource"><span class="resourceIcon">⛓️</span><span id="metalValue">100</span></div>
        <div class="resource"><span class="resourceIcon">⚡</span><span id="energyValue">50</span></div>
    </div>
    <div class="hudPanel"><div id="factionBadge" style="font-size:11px;font-weight:900;">WATER</div></div>
</div>

<div id="debugHUD"><span id="mapName">FOREST</span> · <span id="fpsValue">60</span> FPS</div>

<div id="selectionPanel" class="selectionPanel">
    <div style="font-weight: 900; font-size: 13px;">No Selection</div>
    <div style="margin-top: 4px; display: flex; gap: 9px; color: var(--ui-muted); font-size: 10px;">
        <span>HP: -</span><span>ATK: -</span><span>DEF: -</span>
    </div>
</div>

<div id="bottomHUD">
    <div class="actionGroup">
        <button id="moveButton" class="actionButton active"><span class="bigIcon">➤</span>MOVE</button>
        <button id="attackButton" class="actionButton"><span class="bigIcon">⚔</span>ATTACK</button>
    </div>
    <div class="actionGroup">
        <button id="cardsButton" class="actionButton"><span class="bigIcon">✦</span>CARDS</button>
        <button id="shopButton" class="actionButton"><span class="bigIcon">▣</span>SHOP</button>
        <button id="menuButton" class="actionButton"><span class="bigIcon">☰</span>MENU</button>
    </div>
</div>

<div id="cardsModal" class="modal"><div class="modalBox"><div class="modalHeader"><div class="modalTitle">Cards</div><button class="closeButton" onclick="closeModal('cardsModal')">✕</button></div><div id="cardGrid"></div></div></div>
<div id="shopModal" class="modal"><div class="modalBox"><div class="modalHeader"><div class="modalTitle">Shop</div><button class="closeButton" onclick="closeModal('shopModal')">✕</button></div><div id="shopGrid"></div></div></div>
<div id="menuModal" class="modal"><div class="modalBox"><div class="modalHeader"><div class="modalTitle">Elemental Frontiers</div><button class="closeButton" onclick="closeModal('menuModal')">✕</button></div><div id="menuContent"></div></div></div>

<script>
"use strict";

const CONFIG = {
    VERSION: "1.0.0",
    TARGET_FPS: 60,
    WORLD_COLS: 64,
    WORLD_ROWS: 40,
    TILE_SIZE: 82,
    CAMERA_MIN_ZOOM: 0.48,
    CAMERA_MAX_ZOOM: 2.15,
    START_ZOOM: 0.82,
};

const GAME = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    dpr: 1,
    camera: { x: 0, y: 0, zoom: CONFIG.START_ZOOM, targetZoom: CONFIG.START_ZOOM, targetX: 0, targetY: 0 },
    map: { name: 'FOREST', cols: CONFIG.WORLD_COLS, rows: CONFIG.WORLD_ROWS, tileSize: CONFIG.TILE_SIZE, tiles: [] },
    resources: { gold: 500, wood: 300, metal: 100, energy: 50 },
    frameCount: 0,
    fps: 60,
    keys: {},
    paused: false,
};

const TILE_COLORS = {
    water: '#1a4d6d',
    grass: '#2d5d3a',
    forest: '#1a3d2a',
    mountain: '#5a6b7a',
    sand: '#8b7d4a',
};

function hash2D(x, y, seed) {
    let h = Math.imul(x ^ seed, 374761393);
    h = Math.imul(h ^ (y * 668265263), 1274126177);
    h ^= h >>> 13;
    h = Math.imul(h, 2246822519);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
}

function smoothNoise(x, y, seed) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const x1 = x0 + 1, y1 = y0 + 1;
    const sx = x - x0, sy = y - y0;
    const a = hash2D(x0, y0, seed), b = hash2D(x1, y0, seed);
    const c = hash2D(x0, y1, seed), d = hash2D(x1, y1, seed);
    const ux = sx * sx * (3 - 2 * sx), uy = sy * sy * (3 - 2 * sy);
    return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
}

function fractalNoise(x, y, seed) {
    let value = 0, amplitude = 0.5, frequency = 1;
    for (let i = 0; i < 4; i++) {
        value += smoothNoise(x * frequency, y * frequency, seed + i * 17) * amplitude;
        frequency *= 2;
        amplitude *= 0.5;
    }
    return value;
}

function generateMap() {
    GAME.map.tiles = [];
    for (let y = 0; y < GAME.map.rows; y++) {
        for (let x = 0; x < GAME.map.cols; x++) {
            const noise = fractalNoise(x * 0.08, y * 0.08, 42);
            let color = TILE_COLORS.grass;
            if (noise < 0.25) color = TILE_COLORS.water;
            else if (noise < 0.35) color = TILE_COLORS.sand;
            else if (noise > 0.65) color = TILE_COLORS.mountain;
            else if (noise > 0.5) color = TILE_COLORS.forest;
            GAME.map.tiles.push({ x, y, color });
        }
    }
}

function resizeCanvas() {
    GAME.dpr = Math.min(window.devicePixelRatio || 1, 2);
    GAME.width = window.innerWidth;
    GAME.height = window.innerHeight;
    GAME.canvas.width = GAME.width * GAME.dpr;
    GAME.canvas.height = GAME.height * GAME.dpr;
    GAME.canvas.style.width = GAME.width + 'px';
    GAME.canvas.style.height = GAME.height + 'px';
    GAME.ctx.scale(GAME.dpr, GAME.dpr);
}

function updateCamera() {
    GAME.camera.x += (GAME.camera.targetX - GAME.camera.x) * 0.12;
    GAME.camera.y += (GAME.camera.targetY - GAME.camera.y) * 0.12;
    GAME.camera.zoom += (GAME.camera.targetZoom - GAME.camera.zoom) * 0.1;
    GAME.camera.zoom = Math.max(CONFIG.CAMERA_MIN_ZOOM, Math.min(CONFIG.CAMERA_MAX_ZOOM, GAME.camera.zoom));
}

function renderMapTiles() {
    const tileSize = GAME.map.tileSize;
    GAME.ctx.fillStyle = '#0a0e14';
    GAME.ctx.fillRect(-5000, -5000, 10000, 10000);
    
    for (const tile of GAME.map.tiles) {
        GAME.ctx.fillStyle = tile.color;
        GAME.ctx.fillRect(tile.x * tileSize, tile.y * tileSize, tileSize, tileSize);
        GAME.ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        GAME.ctx.lineWidth = 0.5;
        GAME.ctx.strokeRect(tile.x * tileSize, tile.y * tileSize, tileSize, tileSize);
    }
}

function render() {
    if (!GAME.ctx) return;
    
    GAME.ctx.save();
    GAME.ctx.translate(GAME.width / 2, GAME.height / 2);
    GAME.ctx.scale(GAME.camera.zoom, GAME.camera.zoom);
    GAME.ctx.translate(-GAME.camera.x, -GAME.camera.y);
    
    renderMapTiles();
    
    GAME.ctx.restore();
    
    GAME.frameCount++;
}

function updateResourceUI() {
    document.getElementById('goldValue').textContent = GAME.resources.gold;
    document.getElementById('woodValue').textContent = GAME.resources.wood;
    document.getElementById('metalValue').textContent = GAME.resources.metal;
    document.getElementById('energyValue').textContent = GAME.resources.energy;
}

function updateFPS(fps) {
    document.getElementById('fpsValue').textContent = Math.round(fps);
}

function closeModal(id) {
    document.getElementById(id).classList.remove('open');
}

function openModal(id) {
    document.getElementById(id).classList.add('open');
}

function handleKeyDown(e) {
    GAME.keys[e.key.toLowerCase()] = true;
    const speed = 80;
    switch(e.key.toLowerCase()) {
        case 'arrowup': GAME.camera.targetY -= speed; break;
        case 'arrowdown': GAME.camera.targetY += speed; break;
        case 'arrowleft': GAME.camera.targetX -= speed; break;
        case 'arrowright': GAME.camera.targetX += speed; break;
    }
}

function handleKeyUp(e) {
    GAME.keys[e.key.toLowerCase()] = false;
}

function handleWheel(e) {
    e.preventDefault();
    GAME.camera.targetZoom *= (e.deltaY > 0 ? 1.1 : 0.9);
}

function handleTouchStart(e) {
    e.preventDefault();
}

function handleTouchMove(e) {
    e.preventDefault();
}

function handleTouchEnd(e) {
    e.preventDefault();
}

function setupUI() {
    document.getElementById('moveButton').addEventListener('click', () => {
        document.querySelectorAll('.actionButton').forEach(b => b.classList.remove('active'));
        document.getElementById('moveButton').classList.add('active');
    });
    
    document.getElementById('cardsButton').addEventListener('click', () => openModal('cardsModal'));
    document.getElementById('shopButton').addEventListener('click', () => openModal('shopModal'));
    document.getElementById('menuButton').addEventListener('click', () => openModal('menuModal'));
}

function setupInput() {
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    document.addEventListener('wheel', handleWheel, { passive: false });
    document.addEventListener('touchstart', handleTouchStart, { passive: false });
    document.addEventListener('touchmove', handleTouchMove, { passive: false });
    document.addEventListener('touchend', handleTouchEnd, { passive: false });
}

function initGame() {
    GAME.canvas = document.getElementById('game');
    GAME.ctx = GAME.canvas.getContext('2d', { alpha: false });
    
    if (!GAME.ctx) {
        console.error('Canvas context failed');
        return;
    }
    
    resizeCanvas();
    generateMap();
    
    GAME.camera.x = (GAME.map.cols * GAME.map.tileSize) / 2;
    GAME.camera.y = (GAME.map.rows * GAME.map.tileSize) / 2;
    GAME.camera.targetX = GAME.camera.x;
    GAME.camera.targetY = GAME.camera.y;
    
    setupInput();
    setupUI();
    updateResourceUI();
    
    console.log('✅ Game initialized - v' + CONFIG.VERSION);
    requestAnimationFrame(gameLoop);
}

let lastTime = 0, frameTime = 0;
function gameLoop(currentTime) {
    const delta = Math.min((currentTime - lastTime) / 1000, 0.033);
    lastTime = currentTime;
    frameTime += delta;
    
    if (!GAME.paused) {
        updateCamera();
        render();
        
        if (frameTime > 0.1) {
            updateFPS(1 / delta);
            frameTime = 0;
        }
    }
    
    requestAnimationFrame(gameLoop);
}

window.addEventListener('load', initGame);
window.addEventListener('resize', resizeCanvas);

if (document.readyState !== 'loading') initGame();
</script>

</body>
</html>
